<style>
:root{--ink:#111;--muted:#6b6b6b;--bg:#f6f5f1;--card:#fff;--line:#e2e0da;--gold:#C99A3D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif}
html,body{max-width:100%;overflow-x:clip}
.bdt-head{text-align:center;background:radial-gradient(700px 300px at 15% -20%,rgba(240,197,102,.14),transparent 60%),linear-gradient(160deg,#0A1C16,#050B09 75%);padding:26px 16px 22px;border-bottom:2px solid #C99A3D}
.bdt-brand{display:inline-flex;align-items:center;gap:16px;text-align:left;vertical-align:top}
.bdt-crest{width:64px;height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.bdt-kicker{font:13px Anton,Impact,sans-serif;letter-spacing:.12em}.bdt-kicker .bh{color:#FF0000}.bdt-kicker .vs{color:#F0C566}.bdt-kicker .rt{color:#7086F0}
.bdt-title{font:clamp(28px,6vw,42px)/1.1 Anton,Impact,sans-serif;margin:4px 0 2px;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 55%,#FBF7E9 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bdt-sub{font:15px Anton,Impact,sans-serif;letter-spacing:.08em;color:#A9BAAE;text-transform:uppercase}
@media(max-width:600px){.bdt-head{padding:20px 12px 16px}.bdt-crest{width:50px}.bdt-brand{gap:12px}}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 16px 18px;border-bottom:1px solid var(--line)}
.tabs button{font:600 14px Archivo,sans-serif;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.tabs button .n{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 7px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button.on .n{background:rgba(255,255,255,.18);color:#fff}
.view{max-width:1150px;margin:0 auto;padding:22px 16px 60px}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ph{all:unset;box-sizing:border-box;cursor:zoom-in;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}
.ph:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.ph:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ph .im{aspect-ratio:4/3;background:#e9e7e1;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{text-align:center;font:600 13.5px/1.35 Archivo,sans-serif;padding:9px 10px 11px;color:var(--ink)}
.more{display:block;margin:22px auto 0;font:600 14px Archivo;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 20px;border-radius:999px;cursor:pointer}
.more[hidden]{display:none}
.msg{text-align:center;color:var(--muted);font-size:15px;padding:50px 10px}
.lb{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,11,9,.92);flex-direction:column;align-items:center;justify-content:center;padding:18px 56px}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 110px);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .lbcap{color:#FBF7E9;text-align:center;font:600 16px Archivo;margin-top:12px}
.lb .lbn{color:#A9BAAE;font-size:12.5px;margin-top:3px;text-align:center}
.lb button{all:unset;cursor:pointer;position:absolute;color:#F0C566;font:34px/1 Archivo;padding:10px;user-select:none}
.lb .x{top:8px;right:14px;font-size:30px}.lb .pv{left:8px;top:50%;transform:translateY(-50%)}.lb .nx{right:8px;top:50%;transform:translateY(-50%)}
@media(max-width:600px){.lb{padding:14px 34px}.lb .pv{left:0}.lb .nx{right:0}}

function thumb(p){return 'https://static.wixstatic.com/media/'+p.id+'/v1/fill/w_480,h_360,al_c,q_80,enc_auto/'+encodeURIComponent(p.id)}
function full(p){return 'https://static.wixstatic.com/media/'+p.id+'/v1/fit/w_1600,h_1600,q_85,enc_auto/'+encodeURIComponent(p.id)}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}

var CK='bdt-dogspots-v1';
function receive(d,cached){
  if(!d||d.type!=='dogspots-data')return;
  if(!cached){got=true;if(!d.error){try{localStorage.setItem(CK,JSON.stringify(d))}catch(e){}}}
  else if(got)return;
  if(cached&&d.error)return;
  cats=(d.categories||[]).filter(function(c){return c&&c.name});
  if(d.error){$('hint').textContent='Sorry – the Dog Spots could not be loaded just now.';return}
  if(!cats.length){$('hint').textContent='No Dog Spots categories found yet.';return}
  $('tabs').innerHTML=cats.map(function(c,i){return '<button data-i="'+i+'">'+esc(c.name)+' <span class="n">'+c.photos.length+'</span></button>'}).join('');
  var want=(location.hash||'').slice(1), start=0;
  if(d.start) want=slug(d.start);
  cats.forEach(function(c,i){if(slug(c.name)===want)start=i});
  show(cur!=null&&cur<cats.length?cur:start);
}
function show(i){
  cur=i; shown=0;
  [].forEach.call($('tabs').children,function(b){b.classList.toggle('on',+b.dataset.i===i)});
  $('grid').innerHTML='';
  var c=cats[i];
  $('hint').textContent=c.photos.length?c.photos.length+' photo'+(c.photos.length===1?'':'s')+' · tap any photo to enlarge':'No photos in this category yet.';
  more();
}
function more(){
  var c=cats[cur], end=Math.min(shown+PER,c.photos.length), h='';
  for(var k=shown;k<end;k++){var p=c.photos[k];
    h+='<button class="ph" data-k="'+k+'"><div class="im"><img loading="lazy" src="'+thumb(p)+'" alt="'+esc(p.caption||c.name)+'"></div>'+(p.caption?'<div class="cap">'+esc(p.caption)+'</div>':'')+'</button>';}
  $('grid').insertAdjacentHTML('beforeend',h); shown=end;
  var left=c.photos.length-shown, m=$('more');
  m.hidden=left<=0; m.textContent='Show more ('+left+' left)';
}
function openLb(k){lbIdx=k;var p=cats[cur].photos[k];$('lbi').src=full(p);$('lbi').alt=p.caption||'';$('lbc').textContent=p.caption||'';$('lbn').textContent=(k+1)+' of '+cats[cur].photos.length;$('lb').classList.add('show')}
function step(n){var L=cats[cur].photos.length;openLb((lbIdx+n+L)%L)}
function closeLb(){$('lb').classList.remove('show');lbIdx=-1}

$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(+b.dataset.i)});
$('grid').addEventListener('click',function(e){var b=e.target.closest('.ph');if(b)openLb(+b.dataset.k)});
$('more').addEventListener('click',more);
$('lbx').addEventListener('click',closeLb);$('lbp').addEventListener('click',function(){step(-1)});$('lbnx').addEventListener('click',function(){step(1)});
$('lb').addEventListener('click',function(e){if(e.target===this)closeLb()});
document.addEventListener('keydown',function(e){if(lbIdx<0)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
var tx=null;$('lb').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
$('lb').addEventListener('touchend',function(e){if(tx==null)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)step(dx<0?1:-1);tx=null},{passive:true});

window.addEventListener('message',function(e){receive(e.data)});
function ask(){if(!got&&window.parent!==window)window.parent.postMessage({type:'dogspots-ready'},'*')}
try{var c0=localStorage.getItem(CK);if(c0)receive(JSON.parse(c0),true)}catch(e){}
// a saved copy of the gallery list on GitHub Pages shows the photos straight away on a first visit;
// the Wix page's own (slower) list replaces it when it arrives, so new photos still appear
try{fetch('https://bdt-1-cpu.github.io/BDT/dogspots.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&!cats.length)receive(d,true)}).catch(function(){})}catch(e){}
ask();var tries=0,t=setInterval(function(){if(got||++tries>40)return clearInterval(t);ask()},tries<10?250:1000);
document.addEventListener('DOMContentLoaded',ask);
setTimeout(function(){if(!got)$('hint').textContent='The Dog Spots gallery loads on bigdogstour.com.'},16000);
window.__dogspots=receive;
})();
</script></body></html>
