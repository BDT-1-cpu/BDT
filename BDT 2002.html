<title>Big Dogs Tour 2002</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#081310;--felt:#0F251D;--felt-hi:#173A2C;--glass:rgba(23,58,44,.55);--gb:rgba(240,197,102,.16);
  --gold:#F0C566;--gold2:#C99A3D;--ink:#F4F1E4;--soft:#A9BAAE;--dim:#72847A;--line:rgba(240,197,102,.12);
  --bh:#FF0000;--bh-deep:#8E0000;--bh-soft:rgba(255,0,0,.16);--rt:#7086F0;--rt-deep:#000080;--rt-soft:rgba(112,134,240,.18);
  --r:16px;--shadow:0 14px 40px -16px rgba(0,0,0,.7)
}
*{box-sizing:border-box}
html{background:#050B09}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;
  background:radial-gradient(1100px 620px at 14% -8%,rgba(240,197,102,.10),transparent 60%),radial-gradient(900px 700px at 100% 0%,rgba(143,163,255,.07),transparent 55%),linear-gradient(160deg,#0A1C16,#050B09 70%);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:16px 16px}
img{max-width:100%;display:block}
button{font-family:inherit}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em}
/* ---------- standard BDT header ---------- */
.bdt-head{position:relative;z-index:5;display:block;width:100%;margin:0;text-align:center;background:radial-gradient(700px 300px at 15% -20%,rgba(240,197,102,.14),transparent 60%),linear-gradient(160deg,#0A1C16,#050B09 75%);padding:26px 16px 22px;border-bottom:2px solid #C99A3D;line-height:normal;letter-spacing:normal}
.bdt-brand{display:inline-flex;align-items:center;gap:16px;text-align:left;vertical-align:top}
.bdt-crest{width:64px;height:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.bdt-kicker{font:13px Anton,Impact,sans-serif;letter-spacing:.12em}.bdt-kicker .bh{color:#FF0000}.bdt-kicker .vs{color:#F0C566}.bdt-kicker .rt{color:#7086F0}
.bdt-title{font:clamp(28px,6vw,42px)/1.1 Anton,Impact,sans-serif;margin:4px 0 2px;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 55%,#FBF7E9 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bdt-sub{font:15px Anton,Impact,sans-serif;letter-spacing:.08em;color:#A9BAAE;text-transform:uppercase}
@media(max-width:600px){.bdt-crest{width:50px}.bdt-kicker{font-size:11px}.bdt-brand{gap:12px}}
/* ---------- tabs ---------- */
.tabbar{position:sticky;top:0;z-index:20;background:rgba(8,19,16,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--gb)}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:12px 14px}
.tabs button{font:14px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--gb);background:rgba(255,255,255,.03);color:#CBD8CE;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:#fff;border-color:rgba(240,197,102,.4)}
.tabs button.on{background:linear-gradient(100deg,#F0C566,#C99A3D);color:#14210F;border-color:var(--gold)}
@media(max-width:700px){.tabs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding:10px 12px}.tabs::-webkit-scrollbar{display:none}.tabs button{font-size:13px;padding:7px 12px}}
.view{display:none;max-width:1180px;margin:0 auto;padding:26px 16px 70px;position:relative;z-index:1}
.view.on{display:block;animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
/* ---------- section heading ---------- */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin:0 0 20px}
.sh h2{margin:0;font:clamp(30px,5vw,44px)/1 Anton,Impact,sans-serif;color:var(--ink);letter-spacing:.01em;text-transform:uppercase}
.sh h2 em{font-style:normal;color:var(--gold)}
.sh .sub{color:var(--soft);font-size:14px}
h3.mini{font:15px Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:28px 0 12px}
.card{background:linear-gradient(155deg,rgba(23,58,44,.7),rgba(15,37,29,.7));border:1px solid var(--gb);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--soft)}.dim{color:var(--dim)}
.BHc{color:var(--bh)}.RTc{color:var(--rt)}
.pill{display:inline-block;font:700 11.5px Archivo;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:rgba(240,197,102,.14);color:var(--gold);white-space:nowrap}
.pill.BH{background:var(--bh-soft);color:#ff6a6a}.pill.RT{background:var(--rt-soft);color:#aab8ff}.pill.R{background:rgba(255,255,255,.06);color:var(--soft)}.pill.L{background:transparent;color:#ff6a6a;box-shadow:inset 0 0 0 1px rgba(255,106,106,.55)}
.av{border-radius:50%;object-fit:cover;flex:none;background:#20352b;display:inline-block;vertical-align:middle}
.ring-BH{box-shadow:0 0 0 2px var(--bh)}.ring-RT{box-shadow:0 0 0 2px var(--rt)}
.zoom{cursor:zoom-in}
.ph{position:relative;overflow:hidden;border-radius:12px;background:#0d2419}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:hover img{transform:scale(1.03)}
.cap{font-size:13px;color:var(--soft);text-align:center;margin-top:8px}
/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .yr{font:clamp(64px,11vw,120px)/.9 Anton,Impact,sans-serif;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 55%,#FBF7E9 90%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
.hero .yr small{font-size:.32em;display:block;letter-spacing:.14em;color:var(--soft);-webkit-text-fill-color:var(--soft);margin-bottom:6px}
.hero .where{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font:clamp(26px,4vw,36px)/1.05 Anton,Impact,sans-serif;text-transform:uppercase}
.hero .where img{width:46px;height:auto;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.hero .strap{font:clamp(18px,2.4vw,22px) Anton,Impact,sans-serif;letter-spacing:.04em;color:var(--gold);text-transform:uppercase}
.hero .dates{color:var(--soft);font-weight:600;margin-top:6px}
.hero .frame{border-radius:18px;overflow:hidden;border:1px solid rgba(240,197,102,.35);box-shadow:0 20px 50px -18px rgba(0,0,0,.8);position:relative;aspect-ratio:16/9;background:#0d2419}
.hero .frame img{width:100%;height:100%;object-fit:cover}
.hero .frame .fc{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font:15px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:18px;overflow:hidden;margin:28px 0 18px;border:1px solid var(--gb);box-shadow:var(--shadow)}
.board .side{padding:16px 22px;display:flex;align-items:center;gap:14px}
.board .side.BH{background:linear-gradient(120deg,#5a0000,#2a0202)}.board .side.RT{background:linear-gradient(240deg,#101d7a,#060B29);justify-content:flex-end;text-align:right}
.board .tn{font:clamp(18px,3vw,26px) Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.board .sc{font:clamp(40px,7vw,64px)/1 Anton,Impact,sans-serif}
.board .side.BH .sc{margin-left:auto}.board .side.RT .sc{margin-right:auto}
.board .mid{background:#0b1a14;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;min-width:130px;text-align:center}
.board .mid b{font:18px Anton,Impact,sans-serif;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.board .mid span{font-size:12px;color:var(--soft)}
@media(max-width:600px){.board{grid-template-columns:minmax(0,1fr)}.board .side{padding:10px 16px}.board .tn{font-size:18px}.board .sc{font-size:40px}.board .side.RT{justify-content:flex-start;text-align:left;flex-direction:row-reverse}.board .side.RT .sc{margin-right:0;margin-left:auto}.board .mid{flex-direction:row;gap:10px;min-width:0}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.kpi{justify-content:flex-start}
.kpi .s{min-height:24px}
@media(max-width:820px){.kpis .kpi:last-child:nth-child(odd){grid-column:1/-1}}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.kpi .v{font:30px/1.1 Anton,Impact,sans-serif;color:var(--gold)}
.kpi .k{font:700 11.5px Archivo;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.kpi .s{font-size:13px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;white-space:nowrap}
.kpi .s span{overflow:hidden;text-overflow:ellipsis}
.kpi .s .av{width:22px!important;height:22px!important}
@media(max-width:600px){.kpi{padding:12px 8px}.kpi .v{font-size:26px}.kpi .k{font-size:10.5px;letter-spacing:.06em}.kpi .s{font-size:12px}}
.jump{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:820px){.jump{grid-template-columns:repeat(2,minmax(0,1fr))}}
.jump button{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 16px;border-radius:14px;border:1px solid var(--gb);background:rgba(255,255,255,.03);transition:background .15s,transform .15s;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;gap:3px;min-width:0;min-height:74px}
.jump button:hover{background:rgba(240,197,102,.08);transform:translateY(-2px)}
.jump b{display:block;font:18px/1.1 Anton,Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.jump span{font-size:13px;line-height:1.3;color:var(--soft)}
@media(max-width:600px){.jump{gap:8px}.jump b{font-size:clamp(12.5px,4vw,15px);letter-spacing:.01em}.jump span{font-size:11.5px}.jump button{padding:11px 12px;min-height:64px}}
/* ---------- venue ---------- */
.venue{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:20px}
@media(max-width:820px){.venue{grid-template-columns:minmax(0,1fr)}}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--gb);aspect-ratio:4/3;background:#0d2419}
.map iframe{width:100%;height:100%;border:0;display:block;filter:saturate(1.05)}
.facts{padding:18px}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px}
.facts dt{font:700 11.5px Archivo;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:2px}
.facts dd{margin:0;font-weight:600}
.linkish{all:unset;cursor:pointer;color:var(--gold);border-bottom:1px dashed rgba(240,197,102,.5)}
/* ---------- captains ---------- */
.caps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:700px){.caps{grid-template-columns:minmax(0,1fr)}}
.capc{padding:26px 20px 20px;text-align:center;position:relative;overflow:hidden}
.capc::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;opacity:.9}
.capc.BH::before{background:linear-gradient(180deg,rgba(255,0,0,.35),transparent)}.capc.RT::before{background:linear-gradient(180deg,rgba(112,134,240,.35),transparent)}
.capc .big{width:168px;height:168px;border-radius:50%;object-fit:cover;margin:0 auto;position:relative;border:5px solid;background:#0d2419}
.capc.BH .big{border-color:var(--bh)}.capc.RT .big{border-color:var(--rt-deep);box-shadow:0 0 0 2px var(--rt)}
.capc .nm{font:28px Anton,Impact,sans-serif;margin-top:14px;text-transform:uppercase;letter-spacing:.02em}
.capc .role{font:700 12px Archivo;letter-spacing:.12em;text-transform:uppercase}
.capc .rec{display:flex;justify-content:center;gap:10px;margin:16px 0 12px}
.capc .rec div{min-width:64px;padding:8px 6px;border-radius:10px;background:rgba(0,0,0,.25)}
.capc .rec b{display:block;font:24px Anton,Impact,sans-serif}.capc .rec span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.capc ul{list-style:none;margin:0;padding:0;text-align:left;font-size:14px}
.capc li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.capc li .rn{font:13px Anton,Impact,sans-serif;color:var(--gold);width:64px;flex:none}
/* ---------- galleries ---------- */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:820px){.g3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}}
.g2 .ph{aspect-ratio:4/3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid .ph{aspect-ratio:1}
@media(max-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.grid .ph{border-radius:8px}}
/* ---------- courses ---------- */
.rc{overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:979/434;background:#0d2419;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .scd{clip-path:inset(0 100% 0 0);transition:clip-path .45s cubic-bezier(.6,0,.2,1)}
.shot.show .scd{clip-path:inset(0 0 0 0)}
@media (hover:hover) and (pointer:fine){.shot:hover .scd{clip-path:inset(0 0 0 0)}}
.shot .lab{position:absolute;left:8px;bottom:8px;font:700 11px Archivo;background:rgba(0,0,0,.62);color:#fff;border-radius:999px;padding:4px 9px;pointer-events:none}
.shot .rnb{position:absolute;left:10px;top:10px;font:16px Anton,Impact,sans-serif;letter-spacing:.06em;background:rgba(8,19,16,.8);border:1px solid var(--gb);color:var(--gold);border-radius:8px;padding:2px 10px}
.rinfo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.rtop{display:flex;justify-content:space-between;gap:8px;font:700 11.5px Archivo;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.cname{font:24px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:8px;font-size:14px}
.row .r{margin-left:auto;font:20px Anton,Impact,sans-serif;color:var(--gold)}
.minibar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#0b1a14}
.minibar i{display:block;height:100%}
/* ---------- itinerary ---------- */
.tl{position:relative;margin:0 0 0 10px;padding:0 0 0 28px;border-left:2px solid rgba(240,197,102,.3)}
.day{position:relative;margin:0 0 16px;padding:14px 16px}
.day::before{content:"";position:absolute;left:-38px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--bg0);border:3px solid var(--gold)}
.day.golf::before{background:var(--gold)}
.day .dd{font:700 12px Archivo;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.day .dt{font:22px Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:2px 0}
.day .dx{font-size:14px;color:var(--soft)}
/* ---------- accommodation ---------- */
.hotel{margin-top:18px;padding:18px 20px;border-left:4px solid var(--gold)}
.hotel .hn{font:24px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--gold);margin-bottom:8px}
.hotel .hn span{display:block;font:600 12.5px Archivo;letter-spacing:.08em;color:var(--soft);margin-top:4px}
.hotel p{margin:0 0 10px;font-size:15px;line-height:1.6;color:var(--ink)}
.hotel .hf{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.hotel .hf li{font:600 12.5px Archivo;border:1px solid var(--gb);border-radius:999px;padding:5px 11px;color:var(--soft)}
.hotel .hl{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.hotel .hl a{display:inline-block;padding:8px 16px;border-radius:999px;background:linear-gradient(100deg,var(--gold),#C99A3D);color:#14210F;font:14px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
@media(max-width:600px){.hotel{padding:14px}.hotel .hn{font-size:20px}.hotel p{font-size:14px}}
/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:820px){.teams{grid-template-columns:minmax(0,1fr)}}
.team{overflow:hidden}
.team .band{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.team.BH .band{background:linear-gradient(120deg,#6a0000,#2a0202)}.team.RT .band{background:linear-gradient(120deg,#101d7a,#060B29)}
.team .band b{font:26px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.team .band span{font:700 12px Archivo;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.team .band b{white-space:nowrap}.team .band .bst{white-space:nowrap;text-align:right}.team .band .bst i{font-style:normal}
@media(max-width:480px){.team .band{padding:12px 14px}.team .band b{font-size:22px}.team .band .bst{display:flex;flex-direction:column;line-height:1.35}.team .band .bst .dot{display:none}}
@media(max-width:350px){.team .band{padding:11px 10px;gap:6px}.team .band b{font-size:19px;letter-spacing:.03em}.team .band span{font-size:10.5px;letter-spacing:.04em}}
.team .tp{aspect-ratio:3/2;border-radius:0}
.roster{list-style:none;margin:0;padding:6px 14px 10px}
.roster li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.roster li:last-child{border-bottom:0}
.roster .no{font:13px 'IBM Plex Mono',monospace;color:var(--dim);width:18px;text-align:right}
.roster .c{font:700 10.5px Archivo;background:var(--gold);color:#14210F;border-radius:4px;padding:1px 5px;margin-left:6px}
.roster .wlh{margin-left:auto;font:600 13px 'IBM Plex Mono',monospace;color:var(--soft);white-space:nowrap}
.roster .np{margin-left:auto;font-size:12px;color:var(--dim);font-style:italic}
.shirts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
.shirts figure{margin:0;display:flex;flex-direction:column;gap:6px}
.shirts .ph{aspect-ratio:1;background:#fff;border-radius:10px;overflow:hidden}
.shirts .ph img{object-fit:contain;padding:6px;box-sizing:border-box}
.shirts figcaption{font:700 11px Archivo;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);text-align:center}
/* ---------- ryder cup ---------- */
.race{padding:16px 18px;margin-bottom:22px}
.race .bar{position:relative;height:34px;border-radius:10px;overflow:hidden;background:#0b1a14;display:flex}
.race .bar i{flex:none;min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;font:15px Anton,Impact,sans-serif;padding:0 10px;transition:width .8s cubic-bezier(.2,.7,.2,1)}

(function(){

  const days=[];const R=T.rounds||[];
  for(let d=new Date(start),i=0;d<=end&&i<14;d.setDate(d.getDate()+1),i++){
    const key=fmtD(d,{weekday:'short',day:'numeric',month:'short'}).replace(',','');
    const rnd=R.find(o=>o.d&&o.d.replace(/\s+/g,' ')===key);
    const extra=(M.itinerary_extra||{})[d.toISOString().slice(0,10)];
    let t,x,golf=false;
    if(rnd&&ABR.includes(rnd.r)){golf=true;t=`Round ${RN[rnd.r]} – ${rnd.c}`;x='Rained off – no golf played'}
    else if(rnd){golf=true;t=`Round ${RN[rnd.r]} – ${rnd.c}`;const rs=rcDone?roundScore(rnd.r):null;x=(rcDone?fmtName(rnd.r)+(rs?` · Bloodhounds ${half(rs[0])} – ${half(rs[1])} Retrievers`:''):'')+(rnd.best&&rnd.best.length?` · Best score ${rnd.best.map(nm).join(' & ')} (${rnd.pts})`:'')}
    else if(i===0){t='Arrival';x=`Tourists arrive in ${T.loc}`}

    days.push(`<div class="card day${golf?' golf':''}"><div class="dd">Day ${i+1} · ${esc(fmtD(d))}</div><div class="dt">${esc(t)}</div>${x?`<div class="dx">${esc(x)}</div>`:''}</div>`);

function fitTabs(){const t=document.getElementById('tabs');const bs=[...t.querySelectorAll('button')];bs.forEach(b=>b.style.fontSize='');
 if(matchMedia('(max-width:760px)').matches)return;let fs=11;
 const over=()=>bs.some(b=>{const sp=b.querySelector('span');return sp&&sp.scrollWidth>b.clientWidth-4});
 while(over()&&fs>8.5){fs-=.25;bs.forEach(b=>b.style.fontSize=fs+'px')}}
fitTabs();addEventListener('resize',fitTabs);
let fold=0;
function fit(){const f=document.querySelector('#v-overview .frame.tph');if(!f)return;
 if(matchMedia('(max-width:760px)').matches){f.style.removeProperty('--fh');return}
 const vb=fold||innerHeight;const top=f.getBoundingClientRect().top+scrollY;
 f.style.setProperty('--fh',Math.max(260,Math.min(680,vb-top-16))+'px')}
try{const s=document.createElement('div');s.style.cssText='position:absolute;left:0;top:0;width:1px;height:'+Math.max(document.documentElement.scrollHeight,3000)+'px;pointer-events:none;visibility:hidden';document.body.appendChild(s);

 const io=new IntersectionObserver(e=>{const r=e[0].intersectionRect;if(r&&r.height>0&&scrollY<5&&r.top<=1){fold=r.bottom;fit()}},{threshold:th});io.observe(s);setTimeout(()=>{try{io.disconnect()}catch(e){}s.remove()},6000)}catch(e){}
fit();addEventListener('resize',fit);document.documentElement.classList.add('lg-ready');})();</script></body></html>
