<title>Big Dogs Tour – Tour Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B09;--card:#0d1f17;--card2:#10261c;--gold:#F0C566;--gold2:#C99A3D;--ink:#F4F1E4;--soft:#A9BAAE;--dim:#72847A;--line:rgba(240,197,102,.14);--bh:#ff2a2a;--bh2:#8E0000;--rt:#7086F0;--rt2:#000080}
*{box-sizing:border-box}html,body{overscroll-behavior:contain;margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Archivo,system-ui,sans-serif;max-width:100%;overflow-x:clip}
a{color:inherit}img{display:block}
.BHc{color:var(--bh)}.RTc{color:var(--rt)}
.lbx{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lbx.on{display:flex}.lbx img{max-width:100%;max-height:78vh;border-radius:10px}
.lbx .cap{max-width:760px;margin-top:12px;text-align:center;color:var(--ink)}.lbx .cap b{display:block;font:15px Anton,Impact,sans-serif;letter-spacing:.08em;color:var(--gold)}
.lbx button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;font:28px/1 Archivo;width:46px;height:46px;border-radius:50%;cursor:pointer}
.lbx .x{top:14px;right:14px}.lbx .p{left:10px;top:50%}.lbx .n{right:10px;top:50%}

html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;gap:34px;background:radial-gradient(120% 90% at 50% 0,#0f2a1d,#050B09 60%)}
.side{width:300px;align-self:center}
.side h1{margin:0;font:44px/.95 Anton,Impact,sans-serif;letter-spacing:.01em}.side h1 em{font-style:normal;color:var(--gold)}
.side p{color:var(--soft);font-size:14px;margin:10px 0 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{font:14px Anton,Impact,sans-serif;letter-spacing:.03em;color:var(--soft);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 0;cursor:pointer}
.grid button.on{color:#14210F;background:linear-gradient(100deg,var(--gold),var(--gold2));border-color:var(--gold)}
.help{margin-top:16px;font-size:12.5px;color:var(--dim);line-height:1.6}.help b{color:var(--soft)}
.phone{position:relative;height:min(100dvh - 24px,860px);aspect-ratio:9/16;max-width:calc(100vw - 24px);border-radius:26px;overflow:hidden;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(240,197,102,.18);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .45s;pointer-events:none}
.sl.on{opacity:1}
.sl .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(22px) brightness(.55);transform:scale(1.1)}
.sl .full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl .fit{position:absolute;left:0;right:0;top:12%;height:52%;width:100%;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
.sl .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,transparent 22%,transparent 45%,rgba(0,0,0,.92) 78%)}
.on .kb{animation:kb 9s ease-out forwards}@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 74px}
.tagp{display:inline-block;font:11px Anton,Impact,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(240,197,102,.16);color:var(--gold);border:1px solid rgba(240,197,102,.4)}
.tagp.jacket{background:rgba(63,191,106,.18);color:#7be19c;border-color:rgba(63,191,106,.5)}.tagp.mde{background:rgba(199,167,255,.15);color:#d2bcff;border-color:rgba(199,167,255,.45)}.tagp.first{background:rgba(159,211,255,.15);color:#b6defd;border-color:rgba(159,211,255,.45)}.tagp.rip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.cap .d{font:13px Anton,Impact,sans-serif;letter-spacing:.12em;color:var(--soft);text-transform:uppercase;margin:10px 0 4px}
.cap .t{font:600 clamp(17px,4.6vw,21px)/1.35 Archivo,sans-serif}
.noimg .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:clamp(60px,22vw,120px)/.85 Anton,Impact,sans-serif;text-transform:uppercase;text-align:center;color:transparent;-webkit-text-stroke:1.5px rgba(240,197,102,.22);padding:0 10px;transform:rotate(-8deg)}
.noimg{background:radial-gradient(100% 70% at 50% 30%,#1d4a33,#071510)}
.rip.noimg,.sl.rip .bg{filter:grayscale(1)}
.sl.rip .full,.sl.rip .fit{filter:grayscale(1)}
/* year cover */
.yc .top{position:absolute;left:0;right:0;top:0;padding:66px 20px 0}
.yc .no{font:12px Anton,Impact,sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.yc .y{font:clamp(86px,30vw,150px)/.82 Anton,Impact,sans-serif;letter-spacing:-.01em;background:linear-gradient(180deg,#fff7dc,#f0c566 60%,#b8892f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.yc .loc{display:flex;align-items:center;gap:9px;font:clamp(24px,7vw,32px)/1 Anton,Impact,sans-serif;margin-top:8px}
.yc .loc img{width:30px;height:20px;border-radius:3px;object-fit:cover}
.yc .strap{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ddd;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(5,11,9,.72);backdrop-filter:blur(6px);border:1px solid rgba(240,197,102,.25);border-radius:14px;padding:10px 12px;min-width:0}
.tile.w{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.tile .k{font:10.5px Anton,Impact,sans-serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.tile .v{font:19px/1.1 Anton,Impact,sans-serif;margin-top:2px}
.tile .s{font-size:12px;color:var(--soft)}
.tile .hd{width:52px;height:52px;border-radius:50%;padding:2px;background:conic-gradient(#f4d27c,#a8792a,#fff1c4,#b8892f,#f4d27c);flex:none}.tile .hd img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;background:#06120d}.mini i{background:#e32020}.mini b{flex:1;background:#2f45d0}
.fact{margin-top:8px;font-size:13px;color:#ddd;line-height:1.45}
.open{display:inline-block;margin-top:10px;pointer-events:auto;text-decoration:none;font:12.5px Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#14210F;background:linear-gradient(100deg,var(--gold),var(--gold2));border-radius:999px;padding:7px 14px}
/* chrome */
.prog{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:5}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}.prog i b{display:block;height:100%;width:0;background:#fff}
.hud{position:absolute;top:20px;left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:5}
.hud .lbl{font:13px Anton,Impact,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 4px #000}
.hud button{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font:14px Archivo;cursor:pointer}
.hud button+button{margin-left:0}
.zones{position:absolute;inset:60px 0 64px;display:flex;z-index:3}.zones div{flex:1}.zones div:first-child{flex:.45}
.rail{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;font:13px Anton,Impact,sans-serif;letter-spacing:.04em;color:#ccc;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 11px;cursor:pointer}
.rail button.on{color:#14210F;background:var(--gold);border-color:var(--gold)}
.sl .open,.sl a{pointer-events:auto;position:relative;z-index:4}
.sl.on .cap,.sl.on .tiles{pointer-events:auto}
@media(max-width:820px){.side{display:none}body{gap:0}}
@media(max-width:520px){.phone{height:100dvh;max-width:100vw;width:100vw;aspect-ratio:auto;border-radius:0}}

const IMG=(f,w,h,mode='fit')=>!f?'':f.startsWith('data:')?f:`https://static.wixstatic.com/media/${wn(f)}/v1/${mode}/w_${w},h_${h},q_85,enc_auto/${wn(f)}`;
const FLAG=c=>c?`https://flagcdn.com/w80/${c}.png`:'';
const fd=d=>{const[dd,mm,yy]=d.split('/');return `${+dd} ${MON[mm-1]} ${yy}`};
const half=v=>{v=Math.round(+v*2)/2;const w=Math.floor(v);return v%1?(w?w:'')+'½':String(w)};
const sc=r=>`${half(r.bh)}–${half(r.rt)}`;
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const range=(a,b)=>{if(!a)return '';const A=new Date(a),B=new Date(b||a);const f=(d,y)=>`${d.getDate()} ${MON[d.getMonth()]}${y?' '+d.getFullYear():''}`;return `${f(A,A.getFullYear()!==B.getFullYear())} – ${f(B,1)}`};
const PAGE=t=>SITE+t.link;
/* shared lightbox: call LB.open(list,i) with list=[{img,cap}] */
const LB=(()=>{const d=document.createElement('div');d.className='lbx';d.innerHTML='<button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">‹</button><img alt=""><div class="cap"></div><button class="n" aria-label="Next">›</button>';
 document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(d));let L=[],i=0;const im=d.querySelector('img'),cp=d.querySelector('.cap');
 const show=k=>{i=(k+L.length)%L.length;im.src=IMG(L[i].img,1600,1200);cp.innerHTML=L[i].cap;d.classList.add('on')};
 d.addEventListener('click',e=>{if(e.target.classList.contains('p'))show(i-1);else if(e.target.classList.contains('n'))show(i+1);else if(e.target===d||e.target.classList.contains('x'))d.classList.remove('on')});
 document.addEventListener('keydown',e=>{if(!d.classList.contains('on'))return;if(e.key==='Escape')d.classList.remove('on');if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);e.stopPropagation()},true);
 return {open:(list,k)=>{L=list;d.querySelector('.p').style.display=d.querySelector('.n').style.display=list.length>1?'':'none';show(k)},isOpen:()=>d.classList.contains('on')}})();
const rcLine=r=>{if(!r)return {lead:'',sub:''};const w=r.w,ws=w==='BH'?r.bh:r.rt,ls=w==='BH'?r.rt:r.bh;
 if(r.bh===r.rt)return {lead:`Halved ${sc(r)}`,sub:w?`${TEAM[w]} retain`:'',k:'H'};
 if(ws<ls)return {lead:`${TEAM[w]} retain`,sub:`${half(ws)}–${half(ls)}${/rained/i.test(r.txt)?' · Round III rained off':''}`,k:w};
 return {lead:`${TEAM[w]} ${half(ws)}–${half(ls)}`,sub:'',k:w}};

const S=[];Y.forEach((t,yi)=>{S.push({yi,t,c:'year'});t.ev.forEach(e=>S.push({yi,t,e,c:e.c}))});
const BIG={tour:'On tour',jacket:'Green Jacket',trophy:'Trophy',mde:'Honours',first:'Firsts',rip:'In memory'};
document.getElementById('slides').innerHTML=S.map((s,i)=>{const t=s.t;
 if(s.c==='year'){const x=rcLine(t.rc);return `<section class="sl yc" data-i="${i}"><img class="full kb" data-src="${IMG(t.img,900,1600,'fill')}" alt=""><div class="shade"></div>
  <div class="top"><div class="no">${ord(s.yi+1)} Big Dogs Tour</div><div class="y">${t.y}</div><div class="loc">${t.flag?`<img src="${FLAG(t.flag)}" alt="">`:''}${esc(t.loc)}${t.cty!==t.loc?', '+esc(t.cty):''}</div><div class="strap">${esc(t.strap||'')}${t.strap?' · ':''}${range(t.start,t.end)}</div></div>
  <div class="cap"><div class="tiles">
   <div class="tile w">${t.bdhead?`<div class="hd"><img src="${t.bdhead}" alt=""></div>`:''}<div><div class="k">The Big Dog</div><div class="v">${esc(t.bigdog.join(' & '))}</div>${t.bdpts?`<div class="s">${t.bdpts} Stableford points</div>`:''}</div></div>
   <div class="tile"><div class="k">Ryder Cup</div>${t.rc?`<div class="v ${x.k==='H'?'':x.k+'c'}">${x.lead}</div><div class="mini"><i style="width:${t.rc.bh/(t.rc.bh+t.rc.rt||1)*100}%"></i><b></b></div>${x.sub?`<div class="s">${x.sub}</div>`:''}`:'<div class="v">–</div><div class="s">Began in 2004</div>'}</div>
   <div class="tile"><div class="k">The field</div><div class="v">${t.players||'–'} dogs</div><div class="s">${t.ev.length} moment${t.ev.length===1?'':'s'} to come</div></div>
  </div>${t.fact?`<div class="fact">${esc(t.fact)}</div>`:''}<a class="open" href="${PAGE(t)}" target="_top">Open the BDT ${t.y} page →</a></div></section>`}
 const e=s.e;return `<section class="sl${e.img?'':' noimg'} ${e.c}" data-i="${i}">${e.img?`<div class="bg" data-bg="${IMG(e.img,300,300)}"></div><img class="fit kb" data-src="${IMG(e.img,1000,1000)}" alt="">`:`<div class="big">${BIG[e.c]}</div>`}<div class="shade"></div>
  <div class="cap"><span class="tagp ${e.c}">${TAG[e.c]}</span><div class="d">${fd(e.d)} · ${esc(t.loc)}</div><div class="t">${esc(e.t)}</div></div></section>`}).join('');
const sl=[...document.querySelectorAll('.sl')];
document.getElementById('rail').innerHTML=Y.map((t,i)=>`<button data-y="${i}">${t.y}</button>`).join('');
document.getElementById('grid').innerHTML=Y.map((t,i)=>`<button data-y="${i}">${t.y}</button>`).join('');
const firstOf=yi=>S.findIndex(s=>s.yi===yi);
let cur=-1,el=0,playing=true,held=false,last=performance.now();
const dur=i=>S[i].c==='year'?8000:Math.min(9000,4500+(S[i].e.t.length*35));
function load(i){const s=sl[i];if(!s)return;s.querySelectorAll('[data-src]').forEach(m=>{m.src=m.dataset.src;m.removeAttribute('data-src')});s.querySelectorAll('[data-bg]').forEach(b=>{b.style.backgroundImage=`url("${b.dataset.bg}")`;b.removeAttribute('data-bg')})}
function show(i){i=Math.max(0,Math.min(S.length-1,i));const yc=cur<0?-1:S[cur].yi;cur=i;el=0;[i,i+1,i+2].forEach(load);
 sl.forEach((s,j)=>{s.classList.toggle('on',j===i);if(j===i){s.querySelectorAll('.kb').forEach(k=>{k.style.animation='none';k.offsetWidth;k.style.animation=''})}});
 const yi=S[i].yi;if(yi!==yc){const n=S.filter(s=>s.yi===yi).length;document.getElementById('prog').innerHTML='<i><b></b></i>'.repeat(n);
  document.querySelectorAll('#rail button,#grid button').forEach(b=>b.classList.toggle('on',+b.dataset.y===yi));const rb=document.querySelector(`#rail button[data-y="${yi}"]`);if(rb)rb.parentElement.scrollTo({left:rb.offsetLeft-rb.parentElement.clientWidth/2+rb.offsetWidth/2,behavior:'smooth'})}
 const k=i-firstOf(yi);document.querySelectorAll('#prog b').forEach((b,j)=>b.style.width=j<k?'100%':'0');
 document.getElementById('lbl').textContent=`BDT ${S[i].t.y} · ${k===0?'The tour':'Moment '+k+' of '+(S.filter(s=>s.yi===yi).length-1)}`}
function tick(now){const dt=now-last;last=now;if(playing&&!held&&cur>=0){el+=dt;const d=dur(cur);const b=document.querySelectorAll('#prog b')[cur-firstOf(S[cur].yi)];if(b)b.style.width=Math.min(100,el/d*100)+'%';
  if(el>=d){if(cur<S.length-1)show(cur+1);else setPlay(false)}}requestAnimationFrame(tick)}
function setPlay(p){playing=p;const b=document.getElementById('pp');b.textContent=p?'❚❚':'▶';b.setAttribute('aria-label',p?'Pause':'Play')}
document.getElementById('pp').onclick=()=>setPlay(!playing);
const jump=yi=>{yi=Math.max(0,Math.min(Y.length-1,yi));show(firstOf(yi))};
document.getElementById('rail').onclick=document.getElementById('grid').onclick=e=>{const b=e.target.closest('button');if(b)jump(+b.dataset.y)};
// tap / hold / swipe
let down=null;const Z=document.getElementById('zones');
Z.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),d:+e.target.dataset.d};setTimeout(()=>{if(down&&performance.now()-down.t>=240)held=true},250)});
const up=e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y,long=performance.now()-down.t>240;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))jump(S[cur].yi+(dx<0?1:-1));else if(!long)show(cur+down.d);held=false;down=null};
Z.addEventListener('pointerup',up);Z.addEventListener('pointercancel',()=>{held=false;down=null});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);else if(e.key===' '){e.preventDefault();setPlay(!playing)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPlay(false)});
show(0);requestAnimationFrame(t=>{last=t;tick(t)});
</script>
</body></html>
