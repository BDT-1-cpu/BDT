<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081310">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BDT Fave Answers</title>
<style>
:root{--bg:#050B09;--card:#0f2219;--card2:#163326;--line:rgba(240,197,102,.18);--gold:#F0C566;--ink:#F4F1E4;--soft:#A9BAAE;--ok:#7bd88f;--warn:#ffb454}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#081310;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
header img{width:34px;height:auto;flex:none}
header h1{margin:0;font-size:17px;letter-spacing:.05em;color:var(--gold)}
header .sub{font-size:12.5px;color:var(--soft)}
header .step{margin-left:auto;font-weight:700;font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums}
.prog{height:3px;background:rgba(255,255,255,.06);max-width:620px;margin:8px auto 0;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
main{padding:18px 16px 40px;max-width:620px;margin:0 auto}
section{display:none}section.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.on{animation:none}.prog i{transition:none}}
.crest{display:block;width:96px;margin:6px auto 14px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:4px 0 6px}
h2{font-size:24px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
.hint{font-size:14px;color:var(--soft);margin:0 0 14px}
p{margin:0 0 12px}.soft{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.old small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.old div{font-size:17px;white-space:pre-wrap}
.old.keep{border-color:var(--ok)}
label.f{display:block;font-size:13px;color:var(--soft);margin:2px 0 6px}
input,textarea{width:100%;font:17px/1.4 inherit;font-family:inherit;color:var(--ink);background:#0a1812;border:1px solid var(--line);border-radius:12px;padding:12px;resize:none}
textarea{min-height:110px}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btns{display:grid;gap:10px;margin-top:16px}
.btns.two{grid-template-columns:1fr 1fr}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 14px;font:700 16px inherit;font-family:inherit;background:var(--gold);color:#111;cursor:pointer;text-align:center}
.btn.ok{background:var(--ok);color:#0b1a10}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.link:focus-visible,.rev button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.link{border:0;background:none;color:var(--gold);font:15px inherit;font-family:inherit;padding:12px 0;text-decoration:underline;cursor:pointer;display:block;margin:4px auto 0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.nav .link{margin:0;padding:8px 0}
.rev{display:grid;gap:8px}
.rev button{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 12px;font:15px/1.35 inherit;font-family:inherit;cursor:pointer}
.rev .t{flex:1;min-width:0}.rev .t b{display:block;font-size:13.5px;color:var(--soft);font-weight:600}
.rev .t span{display:block;overflow-wrap:anywhere}
.chip{flex:none;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-top:2px}
.chip.keep{background:var(--ok);color:#0b1a10}.chip.changed,.chip.new{background:var(--gold);color:#111}
.chip.todo{border:1px solid var(--warn);color:var(--warn)}.chip.blank{border:1px solid var(--line);color:var(--soft)}
.warn{color:var(--warn);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink);opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>

<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
/* Questions. "label" must match the Master Playbook "Fave Answers" heading: the reply sends
   "label: answer" lines and fave_answers.py matches them by that heading. */
const QS=[
 {k:'night',sec:'On tour',label:'Best night on tour',q:'Your best night on tour?',hint:'Which night, and on which tour?'},
 {k:'tour',sec:'On tour',label:'Favourite tour',q:'Your favourite tour?',hint:'e.g. Miami 2011'},
 {k:'shirt',sec:'On tour',label:'Favourite tour shirt',q:'Your favourite tour shirt?',hint:'Which year, and which team or colour?'},
 {k:'stash',sec:'On tour',label:'Favourite stash',q:'Your favourite bit of stash?',hint:'The best tour kit or freebie: bags, layers, speakers…'},
 {k:'course',sec:'On tour',label:'Favourite tour course',q:'Your favourite tour course?',hint:'e.g. Alcanada'},
 {k:'match',sec:'On the course',label:'Favourite match',q:'Your favourite match?',hint:'Which tour, round and course, who you played with and against, and what happened.'},
 {k:'loss',sec:'On the course',label:'Toughest loss',q:'Your toughest loss?',hint:'Which tour, round and course, who you played with and against, and what happened.'},
 {k:'extra',sec:'Last one',label:'Anything else',q:'Anything else?',hint:'Optional: nicknames you picked up on tour, a story, or a note for Paddy.'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tidy=s=>String(s||'').replace(/\r/g,'').replace(/[ \t]+\n/g,'\n').trim();

let P={n:'',a:{}};   // from the link: name and 2026 answers
let A={}, S={};      // answers now; per question 'keep' | 'edit' | 'skip'
let at=-1;           // -1 = welcome, 0..QS.length-1 = a question, QS.length = review, QS.length+1 = sent
let loadNote='';

/* the link carries the player's 2026 answers after the # (that part is never sent to the web server):
   #z.<base64url of deflate-compressed JSON>; no # gives a blank form for a new player */
async function readLink(){
 const h=location.hash.slice(1);
 if(!h.startsWith('z.'))return null;
 const b=atob(h.slice(2).replace(/-/g,'+').replace(/_/g,'/'));
 const s=new Blob([Uint8Array.from(b,c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
 return JSON.parse(await new Response(s).text());
}
const key=()=>'bdt-faves-'+(P.n||'new');
function save(){try{localStorage.setItem(key(),JSON.stringify({n:P.n,a:A,s:S,at}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(key()))}catch(e){return null}}

const had=q=>q.k!=='extra'&&!!tidy(P.a[q.k]);
function state(q){
 const v=tidy(A[q.k]);
 if(!had(q))return v?'new':(S[q.k]==='skip'?'blank':'todo');
 if(S[q.k]==='keep'||(S[q.k]==='edit'&&v===tidy(P.a[q.k])))return 'keep';
 if(S[q.k]==='edit'&&v)return 'changed';
 return 'todo'}
const CHIP={keep:'✓ Still right',changed:'Changed',new:'New',todo:'To do',blank:'Left blank'};

function head(){
 const n=QS.length;
 $('step').textContent=at>=0&&at<n?`${at+1} of ${n}`:'';
 $('bar').style.width=(at<0?0:Math.min(at,n)/n*100)+'%';
 $('sub').textContent=P.n?`${P.n} · player profiles 2027`:'Player profiles 2027'}

function go(i){at=i;save();draw();scrollTo(0,0)}
function draw(){
 head();
 const n=QS.length;
 if(at<0)return welcome();
 if(at<n)return question(QS[at]);
 if(at===n)return review();
 sent()}

function welcome(){
 const have=QS.some(had);
 $('main').innerHTML=`<section class="on"><img class="crest" alt="Big Dogs Tour crest" src="${$('crest').src}">
  <h2>${P.n?`Hi ${esc(P.n)}`:'Hi there'}</h2>
  ${have?`<p>Paddy is updating everyone's favourite answers for the 2027 player profile videos.</p>
   <p>You'll go through your 2026 answers one at a time. For each one, tap <b>✓ Still right</b> or <b>Change it</b>. At the end, press <b>Send to Paul</b>.</p>`
  :`<p>Paddy is collecting everyone's favourite answers for the 2027 player profile videos.</p><p>Answer as many as you can, one at a time. A line or two each is perfect, as they go on screen in your video. At the end, press <b>Send to Paul</b>.</p>`}
  <p class="soft">Takes about two minutes. Your answers are kept on this phone until you send them.</p>
  ${loadNote?`<p class="warn">${esc(loadNote)}</p>`:''}
  ${P.n?'':'<label class="f" for="who">Your BDT name (the one you go by on tour)</label><input id="who" autocomplete="off" placeholder="e.g. Paddy">'}
  <div class="btns"><button class="btn" id="start">${Object.keys(S).length?'Carry on':'Start'}</button></div></section>`;
 $('start').onclick=()=>{
  if(!P.n){const w=tidy($('who').value);if(!w){$('who').focus();toast('Pop your name in first');return}
   const keep={a:A,s:S};P.n=w;const d=load();if(d){A=d.a||{};S=d.s||{}}else{A=keep.a;S=keep.s}}
  const first=QS.findIndex(q=>state(q)==='todo');go(Object.keys(S).length&&first>=0?first:0)}}

function question(q){
 const old=tidy(P.a[q.k]),editing=!had(q)||S[q.k]==='edit',kept=state(q)==='keep'&&S[q.k]==='keep';
 let body='';
 if(had(q)){
  body+=`<div class="card old${kept?' keep':''}"><small>Your 2026 answer</small><div>${esc(old)}</div></div>`;
  if(!editing)body+=`<div class="btns two"><button class="btn ok" id="keep">✓ Still right</button><button class="btn sec" id="edit">Change it</button></div>`;
 }
 if(editing){
  body+=`<label class="f" for="ans">${had(q)?'Your new answer':q.k==='extra'?'Your note':'Your answer'}</label><textarea id="ans">${esc(A[q.k]||'')}</textarea>
   <div class="btns"><button class="btn" id="next">${at===QS.length-1?'Done':'Next'}</button></div>`+
   (had(q)?`<button class="link" id="undo">Keep my 2026 answer instead</button>`:`<button class="link" id="skip">${q.k==='extra'?'Nothing to add':'Skip this one'}</button>`);
 }
 $('main').innerHTML=`<section class="on"><div class="eyebrow">${esc(q.sec)}</div><h2>${esc(q.q)}</h2><p class="hint">${esc(q.hint)}</p>${body}
  <div class="nav"><button class="link" id="back">‹ Back</button>${at>0?`<button class="link" id="rv">See all answers</button>`:''}</div></section>`;
 const next=()=>go(at+1);
 if($('keep'))$('keep').onclick=()=>{S[q.k]='keep';A[q.k]=P.a[q.k];$('keep').textContent='✓ Got it';setTimeout(next,280)};
 if($('edit'))$('edit').onclick=()=>{S[q.k]='edit';A[q.k]=P.a[q.k];save();draw();const t=$('ans');t.focus();t.setSelectionRange(t.value.length,t.value.length)};
 if($('ans'))$('ans').oninput=e=>{A[q.k]=e.target.value;if(!had(q))S[q.k]=tidy(e.target.value)?'edit':S[q.k];save()};
 if($('next'))$('next').onclick=()=>{if(had(q)&&!tidy(A[q.k])){A[q.k]=P.a[q.k];S[q.k]='keep'}else if(!had(q))S[q.k]=tidy(A[q.k])?'edit':'skip';next()};
 if($('undo'))$('undo').onclick=()=>{S[q.k]='keep';A[q.k]=P.a[q.k];next()};
 if($('skip'))$('skip').onclick=()=>{S[q.k]='skip';A[q.k]='';next()};
 $('back').onclick=()=>go(at-1);
 if($('rv'))$('rv').onclick=()=>go(QS.length);
}

function review(){
 const todo=QS.filter(q=>state(q)==='todo');
 $('main').innerHTML=`<section class="on"><div class="eyebrow">All done?</div><h2>Check your answers</h2>
  <p class="hint">Tap any answer to change it.</p>
  <div class="rev">${QS.map((q,i)=>{const st=state(q),v=tidy(A[q.k])||tidy(P.a[q.k]);
   return `<button data-i="${i}"><span class="t"><b>${esc(q.label)}</b><span>${esc(v)||'<i class="soft">No answer</i>'}</span></span><span class="chip ${st}">${CHIP[st]}</span></button>`}).join('')}</div>
  ${todo.length?`<p class="warn" style="margin-top:14px">${todo.length} still to do. You can send anyway: those answers stay as they are.</p>`:''}
  <div class="btns"><button class="btn" id="send">Send to Paul</button></div>
  <button class="link" id="back">‹ Back</button></section>`;
 document.querySelectorAll('.rev button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
 $('send').onclick=send;$('back').onclick=()=>go(QS.length-1)}

function sent(){
 $('main').innerHTML=`<section class="on"><img class="crest" alt="" src="${$('crest').src}"><h2>Nearly there</h2>
  <p>WhatsApp should have opened with your answers ready to go. <b>Make sure you press send in WhatsApp.</b></p>
  <p class="soft">Didn't open? Copy your answers and paste them into a WhatsApp message to Paul.</p>
  <div class="btns"><button class="btn" id="again">Send to Paul again</button><button class="btn sec" id="copy">Copy my answers</button></div>
  <button class="link" id="back">‹ Back to my answers</button></section>`;
 $('again').onclick=send;$('copy').onclick=copy;$('back').onclick=()=>go(QS.length)}

/* ---------- the reply: one "label (status): answer" line per question ---------- */
function message(){
 const st=QS.map(state),c=s=>st.filter(x=>x===s).length;
 const sum=[c('changed')&&`${c('changed')} changed`,c('keep')&&`${c('keep')} still right`,c('new')&&`${c('new')} new`,c('todo')&&`${c('todo')} not checked`].filter(Boolean).join(' · ');
 const tag={keep:' (✓ still right)',changed:' (changed)',new:' (new)',todo:' (not checked)',blank:''};
 const lines=QS.map((q,i)=>{const v=tidy(A[q.k])||tidy(P.a[q.k]);
  if(!v)return '';   // nothing to say for a question with no answer, then or now
  return `${q.label}${tag[st[i]]}: ${st[i]==='todo'?tidy(P.a[q.k]):v}`}).filter(Boolean);
 return `*BDT faves – ${P.n}*\n${sum}\n\n${lines.join('\n')}`}
async function send(){
 const text=message();go(QS.length+1);
 if(navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==='AbortError')return}}
 location.href='https://wa.me/?text='+encodeURIComponent(text)}
async function copy(){const text=message();
 try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
 toast('Copied – paste it into WhatsApp to Paul')}
