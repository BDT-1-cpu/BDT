<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><script id="bdt-guard">(function(){var alone;try{alone=window.top===window.self}catch(e){alone=false}if(!alone||/BDTApp/.test(navigator.userAgent)||location.protocol==='file:'||/^(localhost|127\.|\[::1\])/.test(location.hostname))return;try{window.stop()}catch(e){}document.documentElement.innerHTML='\x3chead>\x3cmeta charset="utf-8">\x3cmeta name="viewport" content="width=device-width,initial-scale=1">\x3cmeta name="robots" content="noindex, nofollow">\x3ctitle>Big Dogs Tour\x3c/title>\x3c/head>\x3cbody style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050B09;color:#F4F1E4;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">\x3cp>This page is part of the Big Dogs Tour website.\x3cbr>\x3ca style="color:#F0C566" href="https://www.bigdogstour.com">Go to www.bigdogstour.com\x3c/a>\x3c/p>\x3c/body>';})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Dogs Tour – Tours</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#F0C566;--gold2:#C99A3D;--ink:#F4F1E4;--soft:#A9BAAE;--dim:#72847A;--gb:rgba(240,197,102,.16);--line:rgba(240,197,102,.12);--bh:#FF0000;--rt:#7086F0;--rtd:#000080}
*{box-sizing:border-box}html{background:#050B09}html,body{max-width:100%;overflow-x:clip}
body{margin:0;color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;background:radial-gradient(1100px 620px at 14% -8%,rgba(240,197,102,.10),transparent 60%),linear-gradient(160deg,#0A1C16,#050B09 70%);background-attachment:fixed;min-height:100vh}
a{color:inherit;text-decoration:none}
.bdt-head{position:relative;z-index:5;text-align:center;background:radial-gradient(700px 300px at 15% -20%,rgba(240,197,102,.14),transparent 60%),linear-gradient(160deg,#0A1C16,#050B09 75%);padding:26px 16px 22px;border-bottom:2px solid #C99A3D}
.bdt-brand{display:inline-flex;align-items:center;gap:16px;text-align:left}
.bdt-crest{width:64px;height:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.bdt-kicker{font:13px Anton,Impact,sans-serif;letter-spacing:.12em}.bdt-kicker .bh{color:#FF0000}.bdt-kicker .vs{color:#F0C566}.bdt-kicker .rt{color:#7086F0}
.bdt-title{font:clamp(28px,6vw,42px)/1.1 Anton,Impact,sans-serif;margin:4px 0 2px;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 55%,#FBF7E9 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bdt-sub{font:15px Anton,Impact,sans-serif;letter-spacing:.08em;color:#A9BAAE;text-transform:uppercase}
@media(max-width:600px){.bdt-crest{width:50px}.bdt-kicker{font-size:11px}.bdt-brand{gap:12px}}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 70px}
/* featured */
.feat{position:relative;display:block;border-radius:20px;overflow:hidden;aspect-ratio:16/7;min-height:300px;border:1px solid rgba(240,197,102,.35);box-shadow:0 24px 60px -24px rgba(0,0,0,.9)}
.feat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s ease}
.feat:hover>img{transform:scale(1.04)}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,9,.92) 0%,rgba(5,11,9,.55) 45%,rgba(5,11,9,0) 75%),linear-gradient(0deg,rgba(5,11,9,.7),transparent 40%)}
.feat .in{position:absolute;z-index:1;left:0;bottom:0;padding:28px 32px;max-width:640px}
.tag{display:inline-block;font:700 11px Archivo;letter-spacing:.14em;text-transform:uppercase;background:var(--gold);color:#14210F;border-radius:999px;padding:4px 11px}
.feat .yr{font:clamp(64px,10vw,124px)/.88 Anton,Impact,sans-serif;margin-top:10px;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 55%,#FBF7E9 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.feat .loc{display:flex;align-items:center;gap:10px;font:clamp(24px,3.4vw,36px)/1 Anton,Impact,sans-serif;text-transform:uppercase;margin-top:6px}
.flag{width:34px;height:auto;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.5);flex:none}
.feat .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;font:700 12.5px Archivo;border-radius:999px;padding:5px 12px;background:rgba(8,19,16,.75);border:1px solid var(--gb);white-space:nowrap}
.chip .av{width:22px;height:22px;border-radius:50%;object-fit:cover}
.chip.BH{border-color:rgba(255,0,0,.6);background:rgba(120,0,0,.55)}.chip.RT{border-color:rgba(112,134,240,.6);background:rgba(0,0,128,.55)}.chip.H{border-color:rgba(240,197,102,.6)}
.go{font:15px Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:14px;display:inline-block}
@media(max-width:700px){.feat{aspect-ratio:auto;min-height:440px}.feat::after{background:linear-gradient(0deg,rgba(5,11,9,.96) 0%,rgba(5,11,9,.65) 50%,rgba(5,11,9,.05) 85%)}.feat .in{padding:20px 18px}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:18px 0 6px}
.st{background:linear-gradient(155deg,rgba(23,58,44,.7),rgba(15,37,29,.7));border:1px solid var(--gb);border-radius:14px;padding:12px 8px;text-align:center}
.st b{display:block;font:30px/1.1 Anton,Impact,sans-serif;color:var(--gold)}.st span{font:700 11px Archivo;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.st.BH b{color:#ff4d4d}.st.RT b{color:#9aabff}
.st{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}
.st span{display:block;line-height:1.25;text-align:center;overflow-wrap:anywhere}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.st{padding:12px 6px}.st:last-child:nth-child(odd){grid-column:1/-1}.st b{font-size:26px}.st span{font-size:10.5px;letter-spacing:.06em}}
@media(max-width:380px){.feat .tag{font-size:9.5px;letter-spacing:.08em;padding:4px 9px}}
/* header mosaic */
.bdt-hero.mosaic{background:#050B09}
.bdt-mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2px;z-index:0}
.bdt-mosaic span{position:relative;display:block;overflow:hidden;background:#0d2419}
.bdt-mosaic img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.82);transition:filter .3s,transform .6s}

.bdt-mosaic i{position:absolute;right:5px;bottom:4px;font:11px Anton,Impact,sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.75);font-style:normal;text-shadow:0 1px 3px #000}
.bdt-hero.mosaic::before{z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(5,11,9,.9) 0%,rgba(5,11,9,.55) 45%,rgba(5,11,9,.15) 80%),linear-gradient(0deg,rgba(5,11,9,.9) 0%,rgba(5,11,9,0) 55%)}
.bdt-hero.mosaic .bdt-hin{z-index:2;pointer-events:none}.bdt-hero.mosaic .bdt-stripe{z-index:2}
@media(max-width:600px){.bdt-mosaic{grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}.bdt-mosaic span:nth-child(n+21){display:none}.bdt-mosaic i{font-size:9px;right:3px;bottom:2px}
 .bdt-hero.mosaic::before{background:linear-gradient(0deg,rgba(5,11,9,.95) 0%,rgba(5,11,9,.6) 50%,rgba(5,11,9,.25) 100%)}}
/* controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.bar h2{margin:0;font:clamp(30px,5vw,42px)/1 Anton,Impact,sans-serif;text-transform:uppercase}.bar h2 em{font-style:normal;color:var(--gold)}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl button{font:13px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--gb);background:rgba(255,255,255,.03);color:#CBD8CE;padding:7px 12px;border-radius:999px;cursor:pointer}
.ctl button.on{background:linear-gradient(100deg,#F0C566,#C99A3D);color:#14210F;border-color:var(--gold)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding-bottom:2px}.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px Archivo;border:1px solid var(--gb);background:rgba(255,255,255,.03);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.filters button img{width:18px;border-radius:2px}
.filters button.on{background:var(--ink);color:#14210F}
@media(min-width:701px){.filters{flex-wrap:wrap;overflow:visible}}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
.tc{position:relative;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#0b1a14;border:1px solid var(--gb);transition:transform .2s,box-shadow .2s,border-color .2s}
.tc:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);border-color:rgba(240,197,102,.45)}
.tc .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:#0d2419}
.tc .ph img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.tc:hover .ph img.bg{transform:scale(1.06)}
.tc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,11,9,.92) 0%,rgba(5,11,9,.35) 45%,rgba(5,11,9,0) 70%)}
.tc .ov{position:absolute;z-index:1;left:14px;right:14px;bottom:10px;display:flex;align-items:flex-end;gap:12px}
.tc .yr{font:54px/.85 Anton,Impact,sans-serif;background:linear-gradient(100deg,#FBF7E9 10%,#F0C566 60%,#FBF7E9 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tc .lc{display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:3px}
.tc .lc b{font:20px/1 Anton,Impact,sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .lc span{display:flex;align-items:center;gap:6px;font:700 11.5px Archivo;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.tc .lc .flag{width:20px}
.tc .no{position:absolute;z-index:1;top:10px;left:12px;font:700 11px Archivo;letter-spacing:.1em;text-transform:uppercase;background:rgba(8,19,16,.75);border:1px solid var(--gb);border-radius:999px;padding:3px 9px;color:var(--gold)}
.tc .ft{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.rcb{display:flex;align-items:center;gap:8px;font:13px Anton,Impact,sans-serif;letter-spacing:.04em}
.rcb .bar2{flex:1;height:8px;border-radius:99px;overflow:hidden;display:flex;background:#16241d}
.rcb .bar2 i{display:block;height:100%}
.rcb .s{min-width:30px;text-align:center}
.res{font:700 12px Archivo;letter-spacing:.06em;text-transform:uppercase}
.res.BH{color:#ff6a6a}.res.RT{color:#9aabff}.res.H{color:var(--gold)}.res.N{color:var(--dim)}
.bd{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--soft)}
.bd img{width:26px;height:26px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold2)}
.bd b{color:var(--ink)}
.tc .arrow{margin-left:auto;font:14px Anton,Impact,sans-serif;color:var(--gold);letter-spacing:.06em}
/* timeline view */
.tl .grid{grid-template-columns:minmax(0,1fr)}
.tl .tc{flex-direction:row;min-height:150px}
.tl .tc .ph{aspect-ratio:auto;width:42%;flex:none}
.tl .tc .ft{justify-content:center}
@media(max-width:620px){.tl .tc{flex-direction:column}.tl .tc .ph{width:100%;aspect-ratio:16/9}}
.empty{text-align:center;color:var(--soft);padding:30px}
.st small{display:block;margin-top:4px;font:600 11.5px/1.2 Archivo,system-ui,sans-serif;color:var(--soft,#A9BAAE);letter-spacing:.02em;text-transform:none}
</style></head><body>
<header class="bdt-head"><div class="bdt-brand"><img class="bdt-crest" src="__CREST__" alt="Big Dogs Tour crest"><div><div class="bdt-kicker"><span class="bh">BLOODHOUNDS</span> <span class="vs">v</span> <span class="rt">RETRIEVERS</span></div><div class="bdt-title">Big Dogs Tour</div><div class="bdt-sub">The Tours</div></div></div></header>
<div class="wrap">
  <a class="feat" id="feat" target="_top"></a>
  <div class="stats" id="stats"></div>
  <div class="bar"><h2>Every <em>Tour</em></h2><div class="ctl" id="ctl"><button data-o="new" class="on">Newest</button><button data-o="old">Oldest</button><button data-v="grid" class="on">Grid</button><button data-v="tl">List</button></div></div>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="grid" id="grid"></div></div>
</div>
<script>
const DATA=/*__DATA__*/null;
const T=DATA.tours,SITE=DATA.site;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const IMG=(f,w,h)=>f?`https://static.wixstatic.com/media/${f}/v1/fill/w_${w},h_${h},al_c,q_82,enc_auto/${f}`:'';
const FLAG=c=>c?`<img class="flag" src="https://flagcdn.com/w40/${c}.png" alt="" width="34" height="23">`:'';
const href=t=>/^https?:/.test(t.link)?t.link:SITE+t.link;
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const half=v=>String(v);
function res(t){const r=t.rc;if(!r)return {cls:'N',txt:'Individual tour – no Ryder Cup'};
  const w=r.res==='Bloodhounds'?'BH':r.res==='Retrievers'?'RT':'H';
  const txt=w==='H'?`Halved – ${r.hold} retain`:`${r.res} win`;return {cls:w,txt,r}}
function num(s){s=String(s);return parseFloat(s.replace('½','.5'))||0}
T.forEach((t,i)=>t.n=i+1);
/* featured = latest */
(function(){const t=T[T.length-1];const r=res(t);const f=document.getElementById('feat');f.href=href(t);
  f.innerHTML=`<img src="${IMG(t.img,1600,700)}" alt=""><div class="in"><span class="tag">Latest tour · ${ord(t.n)} Big Dogs Tour</span><div class="yr">${t.y}</div><div class="loc">${FLAG(t.flag)}<span>${esc(t.loc)}</span></div>
  <div class="meta">${t.rc?`<span class="chip ${r.cls}">${esc(r.txt)} · ${esc(t.rc.bh)}–${esc(t.rc.rt)}</span>`:''}${t.bigdog.map(b=>`<span class="chip">${b.h?`<img class="av" src="${b.h}" alt="">`:''}Big Dog: ${esc(b.n)}</span>`).join('')}</div><span class="go">View the ${t.y} tour →</span></div>`})();
/* stats */
(function(){const rc=T.filter(t=>t.rc);
  // cups count wins and retentions (a halved Ryder Cup is kept by the holders), as on Home and in the Playbook
  const cups=k=>rc.filter(t=>(t.rc.hold||t.rc.res)===k).length,won=k=>rc.filter(t=>t.rc.res===k).length;
  const bh=cups('Bloodhounds'),rt=cups('Retrievers'),bw=won('Bloodhounds'),rw=won('Retrievers');
  const ctys=new Set(T.map(t=>t.cty)).size;
  document.getElementById('stats').innerHTML=`<div class="st"><b>${T.length}</b><span>Tours</span></div><div class="st"><b>${ctys}</b><span>Countries</span></div><div class="st BH"><b>${bh}</b><span>Bloodhound cups</span><small>${bw} won · ${bh-bw} retained</small></div><div class="st RT"><b>${rt}</b><span>Retriever cups</span><small>${rw} won · ${rt-rw} retained</small></div><div class="st"><b>${rc.length}</b><span>Ryder Cups</span><small>since ${rc[0].y}</small></div>`})();
/* filters */
let order='new',view='grid',fc='All';
(function(){const c={};T.forEach(t=>{c[t.cty]=c[t.cty]||{n:0,f:t.flag};c[t.cty].n++});
  document.getElementById('filters').innerHTML=`<button data-c="All" class="on">All tours · ${T.length}</button>`+Object.entries(c).sort((a,b)=>b[1].n-a[1].n||a[0].localeCompare(b[0])).map(([k,v])=>`<button data-c="${esc(k)}">${v.f?`<img src="https://flagcdn.com/w40/${v.f}.png" alt="">`:''}${esc(k)} · ${v.n}</button>`).join('')})();
function card(t){const r=res(t);let rcb='';
  if(t.rc){const a=num(t.rc.bh),b=num(t.rc.rt),tot=a+b||1;rcb=`<div class="rcb"><span class="s" style="color:#ff6a6a">${esc(t.rc.bh)}</span><span class="bar2"><i style="width:${a/tot*100}%;background:var(--bh)"></i><i style="flex:1;background:var(--rtd)"></i></span><span class="s" style="color:#9aabff">${esc(t.rc.rt)}</span></div>`}
  return `<a class="tc" href="${href(t)}" target="_top"><div class="ph"><img class="bg" loading="lazy" src="${IMG(t.img,800,500)}" alt=""><span class="no">${ord(t.n)} tour${t.month?' · '+t.month:''}</span><div class="ov"><span class="yr">${t.y}</span><span class="lc"><b>${esc(t.loc)}</b><span>${FLAG(t.flag)}${esc(t.cty)}</span></span></div></div>
  <div class="ft">${rcb}<div class="res ${r.cls}">${esc(r.txt)}</div><div class="bd">${t.bigdog.length?`${t.bigdog[0].h?`<img src="${t.bigdog[0].h}" alt="">`:''}<span>Big Dog: <b>${esc(t.bigdog.map(b=>b.n).join(' & '))}</b></span>`:''}<span class="arrow">View →</span></div></div></a>`}
function draw(){let L=T.filter(t=>fc==='All'||t.cty===fc);if(order==='new')L=L.slice().reverse();
  document.getElementById('grid').innerHTML=L.length?L.map(card).join(''):'<div class="empty">No tours</div>';
  document.getElementById('list').className=view==='tl'?'tl':''}
document.addEventListener('click',e=>{const b=e.target.closest('[data-o],[data-v],[data-c]');if(!b)return;
  if(b.dataset.o){order=b.dataset.o;document.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.v){view=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.c){fc=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))}
  draw()});
draw();
</script></body></html>
