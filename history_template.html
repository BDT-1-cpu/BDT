<!doctype html>
<html lang="en"><head><meta name="robots" content="noindex, nofollow"><script id="bdt-guard">(function(){var alone;try{alone=window.top===window.self}catch(e){alone=false}if(!alone||location.protocol==='file:'||/^(localhost|127\.|\[::1\])/.test(location.hostname))return;try{window.stop()}catch(e){}document.documentElement.innerHTML='\x3chead>\x3cmeta charset="utf-8">\x3cmeta name="viewport" content="width=device-width,initial-scale=1">\x3cmeta name="robots" content="noindex, nofollow">\x3ctitle>Big Dogs Tour\x3c/title>\x3c/head>\x3cbody style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050B09;color:#F4F1E4;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box">\x3cp>This page is part of the Big Dogs Tour website.\x3cbr>\x3ca style="color:#F0C566" href="https://www.bigdogstour.com">Go to www.bigdogstour.com\x3c/a>\x3c/p>\x3c/body>';})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Dogs Tour – History</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050B09;--card:#0d1f17;--card2:#10261c;--gold:#F0C566;--gold2:#C99A3D;--ink:#F4F1E4;--soft:#A9BAAE;--dim:#72847A;--line:rgba(240,197,102,.14);--bh:#ff2a2a;--rt:#7086F0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Archivo,system-ui,sans-serif;max-width:100%;overflow-x:clip}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px 50px}
/* intro + numbers */
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:26px;align-items:stretch}
.intro .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.intro p{margin:0;color:var(--soft)}.intro p b{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nums div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.nums b{font:30px/1 Anton,Impact,sans-serif;color:var(--gold)}.nums i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:4px}
/* sticky controls */
.bar{position:sticky;top:0;z-index:20;background:rgba(5,11,9,.94);backdrop-filter:blur(6px);margin:22px -28px 0;padding:12px 28px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:14px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);background:#0b1914;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chips button.on{background:linear-gradient(100deg,var(--gold),var(--gold2));color:#14210F;border-color:var(--gold)}
.chips button span{opacity:.7;margin-left:5px}
.years{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:thin}
.years a{flex:none;text-decoration:none;font:13px Anton,Impact,sans-serif;color:var(--dim);padding:4px 8px;border-radius:8px;letter-spacing:.04em}
.years a:hover,.years a.on{color:var(--gold);background:rgba(240,197,102,.08)}
/* timeline */
.tl{position:relative;margin-top:26px}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(var(--gold2),rgba(201,154,61,.15))}
.yr{position:relative;display:flex;justify-content:center;margin:30px 0 18px;scroll-margin-top:110px}
.yr .pill{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--gold2);border-radius:999px;padding:6px 8px 6px 18px}
.yr .pill b{font:30px/1 Anton,Impact,sans-serif;color:var(--gold)}
.yr .pill span{font-size:13px;color:var(--soft)}
.yr .pill a{font:12px Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#14210F;background:linear-gradient(100deg,var(--gold),var(--gold2));border-radius:999px;padding:6px 12px}
.ev{position:relative;width:50%;padding:0 36px 18px 0}
.ev.r{margin-left:50%;padding:0 0 18px 36px}
.ev::after{content:"";position:absolute;top:22px;right:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--gold)}
.ev.r::after{right:auto;left:-7px}
.ev.c-tour::after{border-color:#5fd39a}.ev.c-jacket::after{border-color:#3fbf6a;background:#1b6b3a}.ev.c-trophy::after{border-color:#F0C566}.ev.c-mde::after{border-color:#c7a7ff}.ev.c-rip::after{border-color:#fff}
.card.e{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:border-color .15s}
.ev.r .card.e{flex-direction:row}.ev:not(.r) .card.e{flex-direction:row-reverse;text-align:right}
.card.e:hover{border-color:rgba(240,197,102,.4)}
.ph{flex:none;width:118px;height:118px;border-radius:12px;overflow:hidden;background:#000;cursor:zoom-in;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .3s}
.ph:hover img{transform:scale(1.04)}
.tx{min-width:0;flex:1}
.dt{font:13px Anton,Impact,sans-serif;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.tag{display:inline-block;font:600 10px Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;border:1px solid}
.ev:not(.r) .tag{margin:0 6px 0 0}
.t-tour{color:#5fd39a;border-color:rgba(95,211,154,.4)}.t-jacket{color:#69d58e;border-color:rgba(63,191,106,.45)}.t-trophy{color:var(--gold);border-color:rgba(240,197,102,.4)}.t-mde{color:#c7a7ff;border-color:rgba(199,167,255,.4)}.t-first{color:#9fd3ff;border-color:rgba(159,211,255,.4)}.t-rip{color:#fff;border-color:rgba(255,255,255,.4)}
.txt{margin-top:6px;font-size:15px}
.ev.hide,.yr.hide{display:none}
.rip .card.e{background:linear-gradient(135deg,#1a1f1d,#0d1511);border-color:rgba(255,255,255,.25)}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.on{display:flex}.lb img{max-width:100%;max-height:78vh;border-radius:10px}
.lb .cap{max-width:760px;margin-top:12px;text-align:center;color:var(--ink)}.lb .cap b{display:block;font:15px Anton,Impact,sans-serif;letter-spacing:.08em;color:var(--gold)}
.lb button{position:absolute;background:rgba(255,255,255,.1);border:0;color:#fff;font:28px/1 Archivo;width:46px;height:46px;border-radius:50%;cursor:pointer}
.lb .x{top:14px;right:14px}.lb .p{left:14px;top:50%}.lb .n{right:14px;top:50%}
@media(max-width:760px){
 .wrap{padding:0 14px 40px}.bar{margin:18px -14px 0;padding:10px 14px}
 .intro{grid-template-columns:1fr}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.chips button{flex:none;font-size:12.5px;padding:6px 11px}
 .tl::before{left:14px}
 .yr{justify-content:flex-start;margin-left:0}.yr .pill{padding:5px 6px 5px 12px;gap:8px}.yr .pill b{font-size:24px}.yr .pill span{display:none}
 .ev,.ev.r{width:auto;margin-left:0;padding:0 0 14px 36px}
 .ev::after,.ev.r::after{left:7px;right:auto;top:18px}
 .ev:not(.r) .card.e,.ev.r .card.e{flex-direction:column;text-align:left}
 .ev:not(.r) .tag{margin:0 0 0 6px}
 .ph{width:100%;height:auto;aspect-ratio:16/10}
}
</style></head><body>
<header class="bdt-head"><img class="bdt-crest" src="{{CREST}}" alt="BDT crest"></header>
<main class="wrap">
 <div class="intro">
  <div class="card"><p>{{INTRO}}</p></div>
  <div class="nums">{{NUMS}}</div>
 </div>
 <div class="bar">
  <div class="chips" id="chips"></div>
  <nav class="years" id="years" aria-label="Jump to year"></nav>
 </div>
 <div class="tl" id="tl"></div>
</main>
<div class="lb" id="lb" role="dialog" aria-label="Photo"><button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">‹</button><img alt=""><div class="cap"></div><button class="n" aria-label="Next">›</button></div>
<script>
const E={{EVENTS}};const TOURS={{TOURS}};const SITE='https://www.bigdogstour.com';
const CATS=[['all','All'],['tour','Tours'],['jacket','Green Jackets'],['trophy','Trophies & traditions'],['mde','MDEs & honours'],['first','Firsts & milestones']];
const TAG={tour:'Tour',jacket:'Green Jacket',trophy:'Trophy',mde:'Honours',first:'First',rip:'In memory'};
const W=(id,w,h)=>id.startsWith('data:')?id:`https://static.wixstatic.com/media/588d17_${id}~mv2.jpg/v1/fit/w_${w},h_${h},q_85,enc_auto/588d17_${id}~mv2.jpg`;
const WF=id=>id.startsWith('data:')?id:`https://static.wixstatic.com/media/588d17_${id}~mv2.jpg/v1/fit/w_1600,h_1200,q_85,enc_auto/588d17_${id}~mv2.jpg`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=d=>{const[dd,mm,yy]=d.split('/');return `${+dd} ${MON[mm-1]} ${yy}`};
let html='',side=0,yrs=[];
const byY={};E.forEach((e,i)=>{e.i=i;(byY[e.y]=byY[e.y]||[]).push(e)});
Object.keys(byY).sort().forEach(y=>{const t=TOURS[y];yrs.push(y);
 html+=`<div class="yr" id="y${y}" data-y="${y}"><div class="pill"><b>${y}</b>${t?`<span>${esc(t.loc)}</span>`:''}${t&&t.link?`<a href="${SITE+t.link}" target="_top">BDT ${y} page →</a>`:''}</div></div>`;
 byY[y].forEach(e=>{const r=side++%2?' r':'';
  html+=`<div class="ev${r} c-${e.c}${e.c==='rip'?' rip':''}" data-c="${e.c}" data-y="${y}"><div class="card e">${e.img?`<div class="ph" data-i="${e.i}"><img loading="lazy" src="${W(e.img,360,360)}" alt="Photo"></div>`:''}<div class="tx"><div class="dt">${fd(e.d)}<span class="tag t-${e.c}">${TAG[e.c]}</span></div><div class="txt">${esc(e.t)}</div></div></div></div>`})});
document.getElementById('tl').innerHTML=html;
const cnt=c=>c==='all'?E.length:E.filter(e=>e.c===c||(c==='first'&&e.c==='rip')).length;
document.getElementById('chips').innerHTML=CATS.map(([k,l],i)=>`<button data-c="${k}" class="${i?'':'on'}">${l}<span>${cnt(k)}</span></button>`).join('');
document.getElementById('years').innerHTML=yrs.map(y=>`<a href="#y${y}" data-y="${y}">${y}</a>`).join('');
document.getElementById('chips').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const c=b.dataset.c;
 document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.ev').forEach(e=>e.classList.toggle('hide',c!=='all'&&e.dataset.c!==c&&!(c==='first'&&e.dataset.c==='rip')));
 document.querySelectorAll('.yr').forEach(y=>y.classList.toggle('hide',!document.querySelector(`.ev[data-y="${y.dataset.y}"]:not(.hide)`)));
 let s=0;document.querySelectorAll('.ev:not(.hide)').forEach(e=>e.classList.toggle('r',s++%2===1))});
document.getElementById('years').addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;ev.preventDefault();const t=document.getElementById('y'+a.dataset.y);if(t&&!t.classList.contains('hide')){const b=document.querySelector('.bar');window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-(b?b.offsetHeight:0)-12,behavior:'smooth'})}});
// lightbox
const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.cap');let cur=0;
const vis=()=>[...document.querySelectorAll('.ev:not(.hide) .ph')].map(p=>+p.dataset.i);
function show(i){cur=i;const e=E[i];li.src=WF(e.img);li.alt=e.t;lc.innerHTML=`<b>${fd(e.d)}</b>${esc(e.t)}`;lb.classList.add('on')}
function step(d){const v=vis();const k=v.indexOf(cur);show(v[(k+d+v.length)%v.length])}
document.getElementById('tl').addEventListener('click',ev=>{const p=ev.target.closest('.ph');if(p)show(+p.dataset.i)});
lb.addEventListener('click',ev=>{if(ev.target.classList.contains('p'))step(-1);else if(ev.target.classList.contains('n'))step(1);else if(ev.target===lb||ev.target.classList.contains('x'))lb.classList.remove('on')});
document.addEventListener('keydown',ev=>{if(!lb.classList.contains('on'))return;if(ev.key==='Escape')lb.classList.remove('on');if(ev.key==='ArrowLeft')step(-1);if(ev.key==='ArrowRight')step(1)});
</script>
</body></html>
