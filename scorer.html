<style>
:root{--bg:#050B09;--card:#0f2219;--card2:#163326;--line:rgba(240,197,102,.18);--gold:#F0C566;--ink:#F4F1E4;--soft:#A9BAAE;--bh:#ff4747;--rt:#7c90ff;--ok:#7bd88f;--warn:#ffb454}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#081310;border-bottom:1px solid var(--line);padding:10px 14px calc(8px) 14px}
header h1{margin:0;font-size:18px;letter-spacing:.04em;color:var(--gold)}
header .sub{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{float:right;font-weight:800;font-size:18px;margin-top:2px}.score .b{color:var(--bh)}.score .r{color:var(--rt)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:#081310;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:4;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px inherit;font-family:inherit}
nav button.on{background:var(--gold);color:#111;border-color:var(--gold)}
main{padding:14px 14px 120px;max-width:720px;margin:0 auto}
section{display:none}section.on{display:block}
h2{font-size:17px;margin:18px 0 8px;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
label.f{display:block;font-size:13px;color:var(--soft);margin:8px 0 4px}
input,select,textarea{width:100%;font:16px inherit;font-family:inherit;color:var(--ink);background:#0a1812;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.hint{font-size:13px;color:var(--soft);margin:6px 0}
.warn{font-size:13.5px;color:var(--warn);margin:6px 0}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:700 15px inherit;font-family:inherit;background:var(--gold);color:#111}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.del{background:transparent;color:var(--soft);border:1px solid var(--line);padding:6px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#0a1812;color:var(--ink);padding:10px 4px;font:600 14px inherit;font-family:inherit}
.seg button.on.b{background:var(--bh);color:#fff}.seg button.on.r{background:var(--rt);color:#fff}.seg button.on.h{background:var(--gold);color:#111}.seg button.on{background:var(--gold);color:#111}
.pl{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.pl:last-child{border-bottom:0}
.pl .n{font-weight:600}.pl .n small{display:block;color:var(--soft);font-weight:400;font-size:12px}
.pick{display:flex;gap:4px}.pick button{width:44px;border:1px solid var(--line);background:#0a1812;color:var(--soft);border-radius:8px;padding:7px 0;font:700 13px inherit;font-family:inherit}
.pick button.on.b{background:var(--bh);color:#fff;border-color:var(--bh)}.pick button.on.r{background:var(--rt);color:#fff;border-color:var(--rt)}
.match .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700}
.side{border-left:4px solid var(--bh);padding-left:8px;margin:6px 0}.side.rt{border-color:var(--rt)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:1px solid var(--line);background:#0a1812;color:var(--ink);border-radius:999px;padding:6px 10px;font:600 13px inherit;font-family:inherit}
.chips button.on{background:var(--gold);color:#111}
.chips button.pc{background:var(--card2)}.chips button.pc.b{color:#ff8a8a}.chips button.pc.r{color:#aab6ff}
.chips button.sug{background:transparent;border-style:dashed;color:var(--soft)}
.wr{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin-top:6px}.wr>span{font-weight:700;overflow-wrap:anywhere}
.pw{display:flex;align-items:center;padding:8px 2px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.05)}
.sc{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;padding:4px 0}
.sc input{text-align:center;font-weight:700}
.b{color:var(--bh)}.r{color:var(--rt)}
table{width:100%;border-collapse:collapse;font-size:14.5px}th,td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}th{color:var(--soft);font-weight:600;font-size:12.5px}
td input{padding:6px;text-align:center;width:60px}
.lb td,.lb th{padding:6px 3px}.lb .mv{font-size:12px;white-space:nowrap}.lb .mv.up{color:var(--ok)}.lb .mv.dn{color:var(--bh)}
.lb tr.top td{background:rgba(240,197,102,.07)}.lb tr.last td{background:rgba(139,90,43,.22)}
.magic{font-size:13.5px;color:var(--soft);margin-top:6px;text-align:center}
.shbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;background:#0a1812;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;max-height:340px;overflow:auto}
.saved{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--soft);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
#ov{position:fixed;inset:0;z-index:20;background:rgba(3,7,5,.96);overflow:auto;display:none;padding:14px 14px 40px}
#ov.on{display:block}#ov .in{max-width:720px;margin:0 auto}
#ov img{display:block;width:100%;border-radius:10px;margin:10px 0;border:1px solid var(--line)}
#ov .bar{position:sticky;top:0;background:rgba(3,7,5,.96);padding:6px 0 8px;display:flex;gap:8px;flex-wrap:wrap}
/* big screen: a 16:9 slide sized to the screen, 1em = 1% of its height */
#bs{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
#bs.on{display:flex}
#bss{position:relative;overflow:hidden;font-family:Archivo,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(90em 60em at 8% -12%,rgba(240,197,102,.13),transparent 60%),linear-gradient(160deg,#0c1f16,#050B09 70%)}
.sl{position:absolute;inset:0;padding:4.5em 6em 5em;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
.sl.on{opacity:1}
.bh{display:flex;align-items:center;gap:2.4em;padding-bottom:1.8em;margin-bottom:2.6em;border-bottom:.25em solid rgba(240,197,102,.45);flex:none}
.bh .cr{width:7.8em;height:10em;background:var(--crest) center/contain no-repeat;flex:none}
.bt{font:7.2em/1 Anton,Impact,sans-serif;color:var(--gold)}.bsu{font:4.2em/1.15 Anton,Impact,sans-serif;margin-top:.15em}
.bk{margin-left:auto;font:600 3.2em/1.1 Archivo,sans-serif;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.bcup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.bgrid{display:grid;grid-template-columns:1fr auto 1fr;column-gap:3em;align-items:end;width:100%}
.bnum{font:26em/.95 Anton,Impact,sans-serif}.bdash{font:14em/1 Anton,Impact,sans-serif;align-self:center}.bnm{font:5.2em/1.2 Anton,Impact,sans-serif}
.bl{font:600 3.8em/1.3 Archivo,sans-serif;margin-top:1em}.bm{font:600 3.6em/1.3 Archivo,sans-serif;color:var(--gold);margin-top:.4em;max-width:85%}
.bcomp{font:600 3em/1.35 Archivo,sans-serif;margin-top:.7em}.bhold{font:500 2.8em/1.3 Archivo,sans-serif;color:var(--soft);margin-top:.7em}
.bmt{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.bmt.two{display:grid;grid-template-columns:1fr 1fr;column-gap:2.5em;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);align-content:center}
.bmr{display:flex;justify-content:space-between;gap:1em;align-items:baseline;padding:.45em 0;border-bottom:.06em solid rgba(255,255,255,.08);font-weight:500;line-height:1.3}
.bmr .w{font-weight:800}.bv{color:var(--soft)}.bres{font-weight:800;white-space:nowrap}.bres.g{color:var(--gold)}
.blb{flex:1;display:grid;grid-template-columns:1fr 1fr;column-gap:3em;align-content:start;min-height:0}
.blr{display:grid;grid-template-columns:var(--gc);align-items:center;padding:.2em .5em;border-radius:.3em;font-weight:700;line-height:1.25}
.blr.bhd{color:var(--soft);font-weight:600;letter-spacing:.05em}.blr.bhd span{font-size:.55em}
.blr .n{text-align:right}.blr .s{color:var(--soft);font-weight:500}.blr.top{background:rgba(240,197,102,.12)}.blr.top>span:first-child,.blr.top .tot{color:var(--gold)}.blr.bot{background:rgba(139,90,43,.38)}
.blr small{font-size:.5em;color:#d9a066;margin-left:.6em;letter-spacing:.05em}.blr .mv{font-size:.68em}.blr .mv.up{color:var(--ok)}.blr .mv.dn{color:var(--bh)}
.blr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btl{flex:1;display:grid;gap:2.2em;min-height:0}
.bti{background:#10261c;border:.2em solid rgba(240,197,102,.3);border-radius:1.6em;padding:1.8em 2.4em;overflow:hidden;min-height:0}
.btt{font:5em/1.05 Anton,Impact,sans-serif;color:var(--gold)}.btd{font:500 2.4em/1.2 Archivo,sans-serif;color:var(--soft);margin:.2em 0 .5em}
.btr{font:3.5em/1.3 Archivo,sans-serif;margin-top:.25em}.btr b{font-weight:800}.btr b.ok{color:var(--ok)}.btr span{color:var(--soft)}
.bst{flex:1;display:flex;align-items:center;line-height:1.45;overflow:hidden;min-height:0}
.bph{flex:1;min-height:0;display:flex;justify-content:center}.bph img{max-width:100%;max-height:100%;object-fit:contain;border-radius:1.2em}
.bteam{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4em;min-height:0}.bth{font:6em/1 Anton,Impact,sans-serif;margin-bottom:.35em}
.btm{font-weight:700;line-height:1.35}.btm small{color:var(--soft);font-weight:500;font-size:.7em}

/* ---------- state ---------- */
const blankComp=()=>[0,1,2].map(()=>({w:'',d:''}));
const blank=()=>({v:1,year:TOUR.year,scorer:'',newPlayers:[],team:{},cap:{BH:'',RT:''},
 shirts:{BH:{colour:'',logo:''},RT:{colour:'',logo:''}},rounds:TOUR.rounds.map(r=>({r:r.r,course:r.course,fmt:r.fmt,rainedOff:false,matches:[],scores:{}})),
 hcp:{},positions:{},trophies:TROPHIES.map(t=>({t:t[0],w:[''],why:''})),notes:'',updated:'',
 watch:{},decided:{},diary:{},comps:{LD:blankComp(),NP:blankComp()},pot:''});
function fix(d){if(!d.shirts)d.shirts={BH:{colour:'',logo:''},RT:{colour:'',logo:''}};if(!d.hcp)d.hcp={};if(!d.watch)d.watch={};if(!d.decided)d.decided={};if(!d.diary)d.diary={};
 if(!d.comps)d.comps={LD:blankComp(),NP:blankComp()};if(d.pot==null)d.pot='';return d}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
fix(S);
let tab='setup';
const PHOTOS={};   // photo of the day per stage – kept in memory only, never saved or sent
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allPlayers=()=>[...PLAYERS,...S.newPlayers.filter(p=>p.short).map(p=>[p.short,p.real||p.short])];
const full=n=>(allPlayers().find(p=>p[0]===n)||[n,n])[1];
const teamOf=n=>S.team[n]||'';
const squad=t=>allPlayers().map(p=>p[0]).filter(n=>S.team[n]===t);
const players=()=>[...squad('BH'),...squad('RT')];
const tcls=n=>teamOf(n)==='BH'?'b':teamOf(n)==='RT'?'r':'';
const TN={BH:'Bloodhounds',RT:'Retrievers'};
let saveT=null;
function save(){S.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 const s=$('saved');s.classList.add('on');clearTimeout(saveT);saveT=setTimeout(()=>s.classList.remove('on'),900);head()}

/* ---------- Ryder Cup points ---------- */
function rpts(R){let b=0,r=0;if(R.rainedOff)return[0,0];R.matches.forEach(m=>{const v=+m.value||1;if(m.res==='BH')b+=v;else if(m.res==='RT')r+=v;else if(m.res==='H'){b+=v/2;r+=v/2}});return[b,r]}
function ptsTo(i){let b=0,r=0;S.rounds.slice(0,i+1).forEach(R=>{const [x,y]=rpts(R);b+=x;r+=y});return[b,r]}
const pts=()=>ptsTo(2);
const fr=v=>{const w=Math.floor(v),f=v-w;return (w||!f?w:'')+(f===.5?'½':f===.25?'¼':f===.75?'¾':'')};
// points on offer: fourball rounds are worth half the bigger squad, singles the whole bigger squad (a solo player plays two matches)
function autoAvail(){const mx=Math.max(squad('BH').length,squad('RT').length);
 return S.rounds.reduce((a,R)=>{if(R.rainedOff)return a;const v=R.matches.reduce((s,m)=>s+(+m.value||1),0);return a+Math.max(v,R.fmt==='Singles'?mx:mx/2)},0)}
const avail=()=>S.pot!==''&&S.pot!=null?+S.pot:autoAvail();
// what each side needs: the holders retain on half the points, the challengers need more than half
function magic(b,r){const T=avail(),half=T/2,H=TOUR.holders,C=H==='BH'?'RT':'BH',hp=H==='BH'?b:r,cp=H==='BH'?r:b,left=T-b-r;
 if(!T)return'';
 if(cp>half)return`${TN[C]} have won the Ryder Cup`;
 if(hp>half)return`${TN[H]} have won the Ryder Cup`;
 if(hp>=half)return left>0?`${TN[H]} have retained the Ryder Cup · ${fr(half+.5-hp)} more to win it outright`:`Halved – ${TN[H]} retain the Ryder Cup`;
 return`${fr(left)} points to play · ${TN[H]} (holders) need ${fr(half-hp)} more to retain · ${TN[C]} need ${fr(half+.5-cp)} more to win`}
function head(){const [b,r]=pts();$('cup').innerHTML=`<span class="b">${fr(b)}</span> – <span class="r">${fr(r)}</span>`;
 $('where').textContent=`BDT ${TOUR.year} · ${TOUR.place} · ${TOUR.dates}`}

/* ---------- running leaderboard ---------- */
// after round i: players with a score in every round played so far are ranked (ties share the higher place); movement is against the previous round played
function board(i){const live=S.rounds.slice(0,i+1).filter(R=>!R.rainedOff);
 const L=players().map(n=>{const s=live.map(R=>R.scores[n]);const tot=s.length&&s.every(v=>v!=null)?s.reduce((a,v)=>a+v,0):null;
  return{n,s:S.rounds.slice(0,i+1).map(R=>R.rainedOff?null:R.scores[n]),tot,mv:null}});
 L.sort((a,b)=>(b.tot??-1)-(a.tot??-1)||a.n.localeCompare(b.n));
 let pos=0,prev=null;L.forEach((x,k)=>{if(x.tot==null){x.pos='';return}if(x.tot!==prev){pos=k+1;prev=x.tot}x.pos=pos});
 const cnt={};L.forEach(x=>{if(x.pos!=='')cnt[x.pos]=(cnt[x.pos]||0)+1});L.forEach(x=>x.p=x.pos===''?'–':(cnt[x.pos]>1?'T':'')+x.pos);
 let j=i-1;while(j>=0&&S.rounds[j].rainedOff)j--;
 if(j>=0&&!S.rounds[i].rainedOff){const P=board(j);L.forEach(x=>{const p=P.find(y=>y.n===x.n);if(p&&p.pos!==''&&x.pos!=='')x.mv=p.pos-x.pos})}
 const placed=L.filter(x=>x.pos!=='');L.has=placed.length>0;L.last=placed.length?placed[placed.length-1].pos:0;
 return L}
const mvTxt=m=>m>0?'▲'+m:m<0?'▼'+(-m):'';
function boardHTML(i){const L=board(i);if(!L.has)return'<p class="hint">Enter the Stableford points above and the running leaderboard appears here.</p>';
 return `<table class="lb"><tr><th>Pos</th><th></th><th>Player</th>${S.rounds.slice(0,i+1).map((R,k)=>`<th>${RN[k]}</th>`).join('')}<th>Total</th></tr>
 ${L.map(x=>`<tr class="${x.pos!==''&&x.pos<=3?'top':x.pos!==''&&x.pos===L.last&&L.last>3?'last':''}"><td>${x.p}</td><td class="mv ${x.mv>0?'up':x.mv<0?'dn':''}">${mvTxt(x.mv)}</td><td class="${tcls(x.n)}">${esc(x.n)}</td>${x.s.map(v=>`<td>${v??'–'}</td>`).join('')}<td><b>${x.tot??'–'}</b></td></tr>`).join('')}</table>
 <p class="hint">Gold = top three · brown = Shitzu spot. ▲▼ = places moved since the last round.</p>`}

/* ---------- longest drive / nearest the pin ---------- */
function compState(k){const c=S.comps[k],q=[];[0,1].forEach(j=>{if(!S.rounds[j].rainedOff&&c[j].w&&!q.includes(c[j].w))q.push(c[j].w)});
 const fin=q.length===1?q[0]:S.rounds[2].rainedOff?'':c[2].w&&(q.length===0||q.includes(c[2].w))?c[2].w:'';return{q,fin}}
function compWhy(k){const c=S.comps[k],{q,fin}=compState(k);if(!fin)return'';
 const won=[0,1].filter(j=>c[j].w===fin&&!S.rounds[j].rainedOff).map(j=>`Round ${RN[j]}${c[j].d?' ('+c[j].d+')':''}`);
 if(q.length===0)won.push(`Round III${c[2].d?' ('+c[2].d+')':''}`);
 return `Won ${won.join(' and ')}${q.length===2?` and beat ${q.find(n=>n!==fin)} in the Round III play-off${c[2].d?' ('+c[2].d+')':''}`:''}`}
function compsHTML(i){const P=players().slice().sort();const pick=(k,v,ph)=>`<select data-cw="${k}"><option value="">${ph}</option>${P.map(n=>`<option ${v===n?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
 const dist=(k,v,ph)=>`<input data-cd="${k}" placeholder="${ph}" value="${esc(v)}">`;
 return COMPS.map(([k,lab,tro])=>{const c=S.comps[k][i],top=`<b>${lab}</b><span class="hint"> · ${tro}</span>`;
  if(i<2)return `<div class="card">${top}<div class="row" style="margin-top:6px">${pick(k,c.w,'Winner today…')}${dist(k,c.d,'e.g. 14th, 285 yds')}</div></div>`;
  const {q}=compState(k);
  if(q.length===1)return `<div class="card">${top}<p class="hint"><b>${esc(q[0])}</b> is the only Round I/II winner, so takes the ${tro} – no play-off needed.</p></div>`;
  if(q.length===2)return `<div class="card"><b>${lab} play-off</b><span class="hint"> · ${tro}</span><p class="hint">Round I winner v Round II winner – whoever wins today takes the ${tro}.</p>
   <div class="seg" data-cfin="${k}">${q.map(n=>`<button class="${c.w===n?'on':''}" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div><div style="margin-top:8px">${dist(k,c.d,'e.g. 7th, 2ft 3in')}</div></div>`;
  return `<div class="card">${top}<p class="hint">No Round I or II winner recorded, so today's winner takes the ${tro}.</p><div class="row">${pick(k,c.w,'Winner…')}${dist(k,c.d,'e.g. 7th, 2ft 3in')}</div></div>`}).join('')}

/* ---------- trophy watch ---------- */
// suggestions from the scores so far (i = round index, -1 for Day I)
function sugg(t,i){if(i<0)return[];const L=board(i).filter(x=>x.tot!=null);
 // top three and bottom three, plus anyone tied with the third
 if(t==='Big Dog'){const cut=L.length>3?L[2].tot:-1;return L.filter(x=>x.tot>=cut).map(x=>({p:[x.n],l:`${x.n} ${x.tot}`}))}
 if(t==='Shitzu'){if(L.length<=3)return[];const cut=L[L.length-3].tot;return L.filter(x=>x.tot<=cut).reverse().map(x=>({p:[x.n],l:`${x.n} ${x.tot}`}))}
 if(t==='Great Dane'||t==='St Bernard'){const k=t==='Great Dane'?'LD':'NP',c=S.comps[k];
  if(i===2){const {q,fin}=compState(k);if(fin)return[{p:[fin],l:q.length===2?`${fin} (won the play-off)`:`${fin} (winner)`}]}
  const W={};[0,1].slice(0,i+1).forEach(j=>{if(c[j].w&&!S.rounds[j].rainedOff)(W[c[j].w]=W[c[j].w]||[]).push('R'+RN[j])});
  return Object.entries(W).map(([n,r])=>({p:[n],l:`${n} (${r.join(' & ')})`}))}
 if(t==='Xolo'){const H=[];S.rounds.slice(0,i+1).forEach((R,j)=>{if(R.rainedOff)return;Object.entries(R.scores).forEach(([n,v])=>{if(v>=38&&S.team[n])H.push({p:[n],l:`${n} ${v} (R${RN[j]})`,s:v})})});return H.sort((a,b)=>b.s-a.s).slice(0,4)}
 return[]}
// each day starts from the day before's contenders until it is changed
function getWatch(st){if(S.watch[st])return S.watch[st];const k=STG.indexOf(st);return k>0?getWatch(STG[k-1]):{}}
function editWatch(st){if(!S.watch[st])S.watch[st]=JSON.parse(JSON.stringify(getWatch(st)));return S.watch[st]}
const wItem=(st,t)=>getWatch(st)[t]||{p:[],note:''};
const freshSugg=(st,t,i)=>{const w=wItem(st,t);return sugg(t,i).filter(s=>!s.p.every(n=>w.p.includes(n)))};
// a trophy marked as won stays won on that day and every day after, and fills in on the Final tab
const SNAME={d1:'Day I',r1:'Round I',r2:'Round II',r3:'Round III'};
function decidedAt(t,st){const D=S.decided[t];return D&&STG.indexOf(D.stage)<=STG.indexOf(st)?D:null}
// each contender has a note of their own
const wNote=(w,n)=>(w.notes&&w.notes[n])||'';
const rowsOf=w=>w.p.map(n=>({n,note:wNote(w,n)}));
const rowTxt=rows=>rows.map(r=>r.note?`${r.n} (${r.note})`:r.n).join(', ');
let PICK=null;   // 'stage|trophy' while choosing who won
function watchHTML(st,list,i){const P=players().slice().sort();return list.map(t=>{const w=wItem(st,t),sg=freshSugg(st,t,i),d=(TROPHIES.find(x=>x[0]===t)||[])[1],D=decidedAt(t,st);
 const top=`<b>${esc(t)}</b>${d?`<span class="hint"> · ${esc(d)}</span>`:''}`;
 if(D)return `<div class="card tw" data-t="${esc(t)}">${top}<div style="margin-top:6px;color:var(--ok);font-weight:700">Won by ${esc(D.p.join(' & '))} <span class="hint">· decided ${SNAME[D.stage]}</span></div>
  ${D.p.filter(n=>wNote(D,n)).map(n=>`<div class="hint">${esc(n)}: ${esc(wNote(D,n))}</div>`).join('')}<button class="btn del" data-wundo style="margin-top:6px">Undo – not decided yet</button></div>`;
 if(PICK===st+'|'+t)return `<div class="card tw" data-t="${esc(t)}">${top}<p class="hint">Who won it? Tick more than one if it's shared.</p>
  ${w.p.map(n=>`<label class="pw"><input type="checkbox" data-pw="${esc(n)}" style="width:auto;margin:0 10px 0 0"><span class="${tcls(n)}">${esc(n)}</span></label>`).join('')}
  <div class="shbar"><button class="btn small" data-pwok>Confirm</button><button class="btn sec small" data-pwx>Cancel</button></div></div>`;
 return `<div class="card tw" data-t="${esc(t)}">${top}
 ${w.p.map(n=>`<div class="wr"><span class="${tcls(n)}">${esc(n)}</span><input data-wn="${esc(n)}" placeholder="Why ${esc(n)}?" value="${esc(wNote(w,n))}"><button class="btn del" data-wdel="${esc(n)}" aria-label="Take ${esc(n)} off">✕</button></div>`).join('')}
 ${sg.length?`<div class="chips">${sg.map((s,k)=>`<button class="sug" data-wsug="${k}">+ ${esc(s.l)}</button>`).join('')}</div>`:''}
 <select data-wadd style="margin-top:8px"><option value="">Add a contender…</option>${P.filter(n=>!w.p.includes(n)).map(n=>`<option>${esc(n)}</option>`).join('')}</select>
 ${!AUTO_T.includes(t)&&w.p.length?`<button class="btn sec small" data-wwon style="margin-top:8px">✓ Mark as won…</button>`:''}</div>`}).join('')}
function bindWatch(el,st,i,redraw){el.querySelectorAll('.tw').forEach(c=>{const t=c.dataset.t;const it=()=>{const W=editWatch(st);const x=W[t]||(W[t]={p:[]});if(!x.notes)x.notes={};return x};
 const on=(q,ev,f)=>{const x=c.querySelector(q);if(x)x[ev]=f};
 // save any half-typed notes before the card is redrawn
 const keep=()=>c.querySelectorAll('[data-wn]').forEach(x=>{const v=x.value.trim();if(v!==wNote(wItem(st,t),x.dataset.wn))it().notes[x.dataset.wn]=v});
 const decide=W=>{const x=it(),notes={};W.forEach(n=>{if(wNote(x,n))notes[n]=wNote(x,n)});
  S.decided[t]={p:W,notes,note:W.length===1?notes[W[0]]||'':W.filter(n=>notes[n]).map(n=>`${n}: ${notes[n]}`).join('; '),stage:st};PICK=null;save();redraw()};
 c.querySelectorAll('[data-wn]').forEach(x=>x.onchange=()=>{it().notes[x.dataset.wn]=x.value.trim();save()});
 c.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{keep();const x=it(),n=b.dataset.wdel;x.p=x.p.filter(y=>y!==n);delete x.notes[n];save();redraw()});
 c.querySelectorAll('[data-wsug]').forEach(b=>b.onclick=()=>{keep();const s=freshSugg(st,t,i)[+b.dataset.wsug];if(!s)return;const x=it();s.p.forEach(n=>{if(!x.p.includes(n))x.p.push(n)});save();redraw()});
 on('[data-wadd]','onchange',e=>{keep();const n=e.target.value;if(!n)return;const x=it();x.p.push(n);save();redraw()});
 on('[data-wwon]','onclick',()=>{keep();const x=it();if(x.p.length===1)decide(x.p.slice());else{PICK=st+'|'+t;save();redraw()}});
 on('[data-pwok]','onclick',()=>{const W=[...c.querySelectorAll('[data-pw]:checked')].map(x=>x.dataset.pw);if(!W.length){alert('Tick who won it first.');return}decide(W)});
 on('[data-pwx]','onclick',()=>{PICK=null;redraw()});
 on('[data-wundo]','onclick',()=>{if(confirm(`Mark the ${t} as not decided yet?`)){delete S.decided[t];save();redraw()}})})}
function watchBox(st,list,i){const id='tw-'+st;const rw=()=>{const c=$(id);if(!c)return;c.innerHTML=watchHTML(st,list,i);bindWatch(c,st,i,rw)};return{html:`<div id="${id}">${watchHTML(st,list,i)}</div>`,bind:rw}}

/* ---------- share box (photo, story, pictures) ---------- */
function shareBox(st,storyLabel){return `<h2>Share the update</h2><div class="card">
 <label class="f">${storyLabel}</label><textarea data-diary="${st}" placeholder="The day's highlights – goes on the pictures and into the write-up">${esc(S.diary[st]||'')}</textarea>
 <label class="f">Photo of the day (optional – not saved, add it just before sharing)</label>
 ${PHOTOS[st]?`<div class="row"><span class="hint" style="color:var(--ok)">Photo added ✓</span><button class="btn del" data-nophoto="${st}" style="flex:none">Remove</button></div>`:`<input type="file" accept="image/*" data-photo="${st}">`}
 <p class="hint">Makes pictures of the update for the WhatsApp group, plus a text version.</p>
 <div class="shbar"><button class="btn" data-make="${st}">Make the pictures</button><button class="btn sec" data-stext="${st}">Copy text</button><button class="btn sec" data-big="${st}">Big screen</button></div>
 <p class="hint">Big screen: connect the phone or laptop to the TV (HDMI cable, AirPlay or Chromecast), turn a phone sideways, then tap Big screen. The screens change every 15 seconds – tap the right of the screen for the next one, the left to go back.</p></div>`}
function bindShare(el,redraw){
 el.querySelectorAll('[data-diary]').forEach(x=>x.onchange=()=>{S.diary[x.dataset.diary]=x.value.trim();save()});
 el.querySelectorAll('[data-photo]').forEach(x=>x.onchange=()=>{const f=x.files&&x.files[0];if(!f)return;const im=new Image();im.onload=()=>{PHOTOS[x.dataset.photo]=im;redraw()};im.onerror=()=>alert("Couldn't read that photo – try another.");im.src=URL.createObjectURL(f)});
 el.querySelectorAll('[data-nophoto]').forEach(b=>b.onclick=()=>{delete PHOTOS[b.dataset.nophoto];redraw()});
 el.querySelectorAll('[data-make]').forEach(b=>b.onclick=()=>{const d=el.querySelector('[data-diary]');if(d){S.diary[d.dataset.diary]=d.value.trim();save()}makePictures(b.dataset.make)});
 el.querySelectorAll('[data-big]').forEach(b=>b.onclick=()=>{const d=el.querySelector('[data-diary]');if(d){S.diary[d.dataset.diary]=d.value.trim();save()}bsOpen(b.dataset.big)});
 el.querySelectorAll('[data-stext]').forEach(b=>b.onclick=()=>{const d=el.querySelector('[data-diary]');if(d){S.diary[d.dataset.diary]=d.value.trim();save()}copy(textFor(b.dataset.stext),'Copied – paste it into the WhatsApp group.')})}

/* ---------- setup ---------- */
function drawSetup(){
 const opts=t=>'<option value="">Choose…</option>'+squad(t).map(n=>`<option ${S.cap[t]===n?'selected':''}>${esc(n)}</option>`).join('');
 const L=allPlayers().slice().sort((a,b)=>(RECENT.has(b[0])-RECENT.has(a[0]))||a[0].localeCompare(b[0]));
 const nb=squad('BH').length,nr=squad('RT').length;
 $('setup').innerHTML=`
 <div class="card"><label class="f">Your name (who is scoring)</label><input id="scorer" value="${esc(S.scorer)}" placeholder="e.g. Paddy"></div>
 <h2>Teams <span class="hint">· <span class="b">${nb} Bloodhounds</span> · <span class="r">${nr} Retrievers</span></span></h2>
 <p class="hint">Tap <b class="b">B</b> or <b class="r">R</b> for everyone on tour. Last year's tourists are listed first.</p>
 <div class="card">${L.map(([n,f])=>`<div class="pl"><div class="n">${esc(n)}<small>${esc(f)}</small></div><div class="pick" data-n="${esc(n)}"><button class="b ${teamOf(n)==='BH'?'on':''}" data-t="BH">B</button><button class="r ${teamOf(n)==='RT'?'on':''}" data-t="RT">R</button></div></div>`).join('')}</div>
 <h2>Captains</h2>
 <div class="card"><div class="row"><div><label class="f b">Bloodhounds</label><select id="capB">${opts('BH')}</select></div><div><label class="f r">Retrievers</label><select id="capR">${opts('RT')}</select></div></div>
  <label class="f">Ryder Cup points on offer</label><input id="pot" type="number" step="0.5" inputmode="decimal" placeholder="${fr(autoAvail())}" value="${esc(S.pot)}">
  <p class="hint">Worked out from the squads (${fr(autoAvail())}) – only fill this in to change it. ${TN[TOUR.holders]} hold the cup: they retain it on half the points.</p></div>
 <h2>Playing handicaps</h2>
 <div class="card">${players().map(n=>`<div class="sc"><span class="${tcls(n)}">${esc(n)}</span><input type="number" inputmode="numeric" min="0" max="54" data-hcp="${esc(n)}" value="${S.hcp[n]??''}"></div>`).join('')||'<span class="hint">Pick the teams first.</span>'}
 ${Object.keys(S.hcp).filter(n=>!S.team[n]).map(n=>`<div class="sc"><span>${esc(n)} <small class="hint">(pulled out)</small></span><input type="number" inputmode="numeric" min="0" max="54" data-hcp="${esc(n)}" value="${S.hcp[n]??''}"></div>`).join('')}
 <p class="hint" style="margin:10px 0 6px">Someone was due to tour but pulled out and was given a new handicap? Add them here:</p>

 <h2>First-timers</h2>
 <div class="card">${S.newPlayers.map((p,i)=>`<div class="row" style="margin-bottom:6px"><input data-np="${i}" data-k="short" placeholder="Short name" value="${esc(p.short)}"><input data-np="${i}" data-k="real" placeholder="Full name" value="${esc(p.real)}"><button class="btn del" data-delnp="${i}">✕</button></div>`).join('')}

 $('scorer').oninput=e=>{S.scorer=e.target.value;save()};
 $('capB').onchange=e=>{S.cap.BH=e.target.value;save()};$('capR').onchange=e=>{S.cap.RT=e.target.value;save()};

 $('setup').querySelectorAll('.pick').forEach(p=>p.onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=p.dataset.n,t=b.dataset.t;
  S.team[n]=S.team[n]===t?'':t;if(!S.team[n])delete S.team[n];['BH','RT'].forEach(k=>{if(S.cap[k]&&S.team[S.cap[k]]!==k)S.cap[k]=''});save();drawSetup()});

/* ---------- Day I (arrival – no golf) ---------- */
function drawDay1(){const el=$('d1'),W=watchBox('d1',WATCH_D1,-1);
 const team=t=>squad(t).map(n=>esc(n)+(S.cap[t]===n?' (c)':'')).join(', ')||'<span class="hint">not picked yet</span>';

/* ---------- finish ---------- */
function totals(){const P=players();const rained=S.rounds.filter(R=>R.rainedOff).length;
 return P.map(n=>{const s=S.rounds.filter(R=>!R.rainedOff).map(R=>R.scores[n]);const done=s.length&&s.every(v=>v!=null);
  let tot=done?s.reduce((a,v)=>a+v,0):null;if(done&&rained===1&&s.length===2)tot=Math.round(tot*3/2);return{n,s:S.rounds.map(R=>R.scores[n]),tot}})}
// suggested finishing positions from the totals (ties share the higher place), overridden by anything typed in
function ranked(){const L=totals().sort((a,b)=>(b.tot??-1)-(a.tot??-1));let pos=0,prev=null;L.forEach((x,k)=>{if(x.tot==null){x.sug='';return}if(x.tot!==prev){pos=k+1;prev=x.tot}x.sug=pos;});L.forEach(x=>x.pos=S.positions[x.n]??x.sug);return L}
function autoPlacings(L){const at=p=>L.filter(x=>+x.pos===p).map(x=>x.n);const placed=L.filter(x=>x.pos!==''&&x.tot!=null);
 if(placed.length){const last=Math.max(...placed.map(x=>+x.pos));
  [['Big Dog',1],['2nd',2],['3rd',3],['Shitzu',last]].forEach(([t,p])=>{const T=S.trophies.find(x=>x.t===t);if(T&&(T.auto||!T.w.some(Boolean))){const w=at(p);if(w.length){T.w=w;T.auto=true}}})}
 COMPS.forEach(([k,,t])=>{const {fin}=compState(k),T=S.trophies.find(x=>x.t===t);if(!T||!fin)return;
  if(T.auto||!T.w.some(Boolean)){T.w=[fin];T.auto=true;if(!T.why||T.autoWhy){T.why=compWhy(k);T.autoWhy=true}}});
 Object.entries(S.decided).forEach(([t,D])=>{const T=S.trophies.find(x=>x.t===t);if(!T||!D.p.length)return;
  if(T.auto||!T.w.some(Boolean)){T.w=D.p.slice();T.auto=true;if(!T.why||T.autoWhy){T.why=D.note||'';T.autoWhy=true}}})}
function drawFinish(){
 const L=ranked();autoPlacings(L);
 const [b,r]=pts();const P=players().sort();
 const opt=v=>'<option value="">Winner…</option>'+[...P,...allPlayers().map(p=>p[0]).filter(n=>!P.includes(n)).sort()].map(n=>`<option ${v===n?'selected':''}>${esc(n)}</option>`).join('');
 const ties=[...new Set(L.filter(x=>x.pos!==''&&x.tot!=null).map(x=>+x.pos))].filter(p=>L.filter(x=>+x.pos===p).length>1);
 const last=Math.max(0,...L.filter(x=>x.pos!==''&&x.tot!=null).map(x=>+x.pos));
 const tieWarn=ties.filter(p=>p<=3||p===last);
 $('finish').innerHTML=`
 <div class="card" style="text-align:center"><div class="hint">Ryder Cup</div><div style="font-size:30px;font-weight:800"><span class="b">${fr(b)}</span> – <span class="r">${fr(r)}</span></div>
  <div class="hint">${b>r?'<b class="b">Bloodhounds win</b>':r>b?'<b class="r">Retrievers win</b>':`Halved – ${TN[TOUR.holders]} (the holders) retain`}</div></div>
 <h2>Final positions</h2><p class="hint">Suggested from the Stableford totals – ties share the higher place (4, 4, 6). Change any that were decided on countback.</p>
 ${tieWarn.length?`<p class="warn">Tie for ${tieWarn.map(p=>p===last?'last place (Shitzu)':['','1st (Big Dog)','2nd','3rd'][p]).join(' and ')} – settle it on countback and change the positions below.</p>`:''}
 <div class="card"><table><tr><th>Player</th><th>I</th><th>II</th><th>III</th><th>Total</th><th>Pos</th></tr>
 ${L.map(x=>`<tr><td class="${tcls(x.n)}">${esc(x.n)}</td>${x.s.map(v=>`<td>${v??'–'}</td>`).join('')}<td><b>${x.tot??'–'}</b></td><td><input type="number" inputmode="numeric" data-pos="${esc(x.n)}" value="${S.positions[x.n]??x.sug}"></td></tr>`).join('')}</table></div>
 <h2>Trophies</h2><p class="hint">Big Dog, 2nd, 3rd and Shitzu fill in from the final positions, and the Great Dane and St Bernard from the play-offs – change them if needed. Give the reason for every award; it goes on the website. The last Trophy watch notes are shown as a reminder.</p>
 ${S.trophies.map((t,ti)=>{const w=wItem('r3',t.t);return `<div class="card"><b>${esc(t.t)}</b>${(TROPHIES.find(x=>x[0]===t.t)||[])[1]?`<span class="hint"> · ${esc(TROPHIES.find(x=>x[0]===t.t)[1])}</span>`:''}
  ${w.p.length?`<div class="hint">Watch: ${esc(rowTxt(rowsOf(w)))}</div>`:''}
  ${t.w.map((v,wi)=>`<div class="row" style="margin-top:6px"><select data-tw="${ti}" data-wi="${wi}">${opt(v)}</select>${wi?`<button class="btn del" data-twdel="${ti}" data-wi="${wi}">✕</button>`:''}</div>`).join('')}
  <button class="btn sec small" data-twadd="${ti}" style="margin-top:6px">+ Joint winner</button>
  <input data-why="${ti}" placeholder="Reason / story" value="${esc(t.why)}" style="margin-top:6px"></div>`}).join('')}
 <h2>Anything else</h2><div class="card"><textarea id="notes" placeholder="New nicknames, stash handed out, anything for the write-up…">${esc(S.notes)}</textarea></div>
 ${shareBox('final','Last word (goes on the final pictures)')}`;
 $('finish').querySelectorAll('[data-pos]').forEach(x=>x.onchange=()=>{const v=x.value.trim();if(v==='')delete S.positions[x.dataset.pos];else S.positions[x.dataset.pos]=+v;save()});
 $('finish').querySelectorAll('[data-tw]').forEach(x=>x.onchange=()=>{const T=S.trophies[+x.dataset.tw];T.w[+x.dataset.wi]=x.value;T.auto=false;save()});
 $('finish').querySelectorAll('[data-twadd]').forEach(b=>b.onclick=()=>{S.trophies[+b.dataset.twadd].w.push('');save();drawFinish()});
 $('finish').querySelectorAll('[data-twdel]').forEach(b=>b.onclick=()=>{S.trophies[+b.dataset.twdel].w.splice(+b.dataset.wi,1);save();drawFinish()});
 $('finish').querySelectorAll('[data-why]').forEach(x=>x.onchange=()=>{const T=S.trophies[+x.dataset.why];T.why=x.value.trim();T.autoWhy=false;save()});
 $('notes').onchange=e=>{S.notes=e.target.value;save()};
 bindShare($('finish'),drawFinish);
}

/* ---------- WhatsApp text ---------- */
function mline(m){const bh=m.bh.filter(Boolean).join(' & ')||'?',rt=m.rt.filter(Boolean).join(' & ')||'?',h=+m.value===.5?' (½ pt)':'';
 if(m.res==='BH')return`${bh} (BH) beat ${rt} (RT) ${m.margin}${h}`;if(m.res==='RT')return`${rt} (RT) beat ${bh} (BH) ${m.margin}${h}`;
 if(m.res==='H')return`${bh} (BH) halved with ${rt} (RT)${h}`;return`${bh} (BH) v ${rt} (RT) – result to come`}
// rows of {n, note} for each trophy worth showing: the winner once decided, otherwise the contenders (or the leaders for the score-based ones)
function watchLines(st,list,i){return list.map(t=>{const D=decidedAt(t,st);
 if(D){const one=D.p.length===1;return{t,won:true,rows:[{n:'Won by '+D.p.join(' & '),note:one?wNote(D,D.p[0]):''},...(one?[]:rowsOf(D).filter(r=>r.note))]}}
 let rows=rowsOf(wItem(st,t));
 if(!rows.length&&i>=0&&AUTO_T.includes(t))rows=sugg(t,i).map(s=>({n:s.l,note:''}));
 return rows.length?{t,rows}:null}).filter(Boolean)}
function compLine(k,i){const [,lab,tro]=COMPS.find(x=>x[0]===k),c=S.comps[k];
 if(i<2){if(S.rounds[i].rainedOff)return'';const w=c[i];return w.w?`${lab}: ${w.w}${w.d?' ('+w.d+')':''}`:''}
 const {q,fin}=compState(k);if(!fin)return q.length===2?`${lab} play-off: ${q[0]} v ${q[1]}`:'';
 return q.length===2?`${lab} play-off: ${fin} beat ${q.find(n=>n!==fin)}${c[2].d?' ('+c[2].d+')':''} – wins the ${tro}`:`${lab}: ${fin} wins the ${tro}${q.length===1?' (no play-off needed)':''}`}
function textFor(st){const L=[],B=s=>`*${s}*`;
 if(st==='d1'){L.push(B(`BDT ${TOUR.year} ${TOUR.location} – Day I`));L.push(`${TOUR.arrive} · ${TOUR.accommodation}`);L.push('');
  ['BH','RT'].forEach(t=>L.push(`${TN[t]}${S.cap[t]?' (capt. '+S.cap[t]+')':''}: ${squad(t).join(', ')}`));L.push(`${TN[TOUR.holders]} hold the Ryder Cup.`);
  const W=watchLines('d1',WATCH_D1,-1);if(W.length){L.push('');L.push(B('Trophy watch'));W.forEach(w=>L.push(`${w.t}: ${rowTxt(w.rows)}`))}}
 else if(st==='final'){const RL=ranked();autoPlacings(RL);const [b,r]=pts();
  L.push(B(`BDT ${TOUR.year} ${TOUR.location} – final results`));L.push('');
  L.push(b>r?`Bloodhounds win the Ryder Cup ${fr(b)} – ${fr(r)}`:r>b?`Retrievers win the Ryder Cup ${fr(r)} – ${fr(b)}`:`Ryder Cup halved ${fr(b)} – ${fr(r)} – ${TN[TOUR.holders]} retain`);
  const T=RL.filter(x=>x.tot!=null).sort((a,b)=>(+a.pos||99)-(+b.pos||99)||b.tot-a.tot);if(T.length){L.push('');L.push(B('Final positions'));T.forEach(x=>L.push(`${x.pos}. ${x.n} ${x.tot}`))}
  const tr=S.trophies.filter(t=>t.w.some(Boolean));if(tr.length){L.push('');L.push(B('Trophies'));tr.forEach(t=>L.push(`${t.t}: ${t.w.filter(Boolean).join(' & ')}${t.why?' – '+t.why:''}`))}}
 else{const i=+st[1]-1,R=S.rounds[i],[b,r]=ptsTo(i),[rb,rr]=rpts(R);
  L.push(B(`BDT ${TOUR.year} ${TOUR.location} – after Round ${RN[i]} (${R.course})`));L.push('');
  if(R.rainedOff)L.push('Round rained off.');
  L.push(`Ryder Cup: Bloodhounds ${fr(b)} – ${fr(r)} Retrievers${R.rainedOff?'':` (today ${fr(rb)} – ${fr(rr)})`}`);L.push(magic(b,r));
  if(!R.rainedOff&&R.matches.length){L.push('');L.push(B('Matches'));R.matches.forEach(m=>L.push('• '+mline(m)))}
  const BD=board(i).filter(x=>x.tot!=null);if(BD.length&&!R.rainedOff){L.push('');L.push(B('Leaderboard'));BD.forEach(x=>L.push(`${x.p}. ${x.n} ${x.tot}${x.mv?' '+mvTxt(x.mv):''}`))}
  const C=COMPS.map(([k])=>compLine(k,i)).filter(Boolean);if(C.length){L.push('');C.forEach(c=>L.push(c))}
  const W=watchLines(st,WATCH_R,i);if(W.length){L.push('');L.push(B('Trophy watch'));W.forEach(w=>L.push(`${w.t}: ${rowTxt(w.rows)}`))}}
 const d=(S.diary[st]||'').trim();if(d){L.push('');L.push(d)}
 L.push('');L.push('www.bigdogstour.com');return L.join('\n')}

/* ---------- WhatsApp pictures (drawn on the phone) ---------- */
// pages are 1080 wide and at most 1920 tall so WhatsApp keeps the text sharp; longer updates run onto more pages
const CW=1080,CP=54,CI=CW-CP*2,MAXH=1920,HEAD1=262,HEAD2=126,FOOT=86,GAP=24;
const K={gold:'#F0C566',ink:'#F4F1E4',soft:'#A9BAAE',bh:'#ff5a5a',rt:'#8a9cff',ok:'#7bd88f',panel:'#10261c',edge:'rgba(240,197,102,.30)'};
const FH=s=>`${s}px Anton, Impact, "Arial Narrow", sans-serif`,FB=(s,w)=>`${w||600} ${s}px Archivo, "Segoe UI", Roboto, system-ui, sans-serif`;
function tx(g,s,x,y,f,c,a){g.font=f;g.fillStyle=c;g.textAlign=a||'left';g.fillText(s,x,y)}
function wrapT(g,s,f,mw){g.font=f;const out=[];String(s).split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{const t=line?line+' '+w:w;if(g.measureText(t).width>mw&&line){out.push(line);line=w}else line=t});if(line)out.push(line)});return out}
function rr(g,x,y,w,h,r,fill,stroke){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function panel(g,y,h,title,right){rr(g,CP,y,CI,h,22,K.panel,K.edge);if(title)tx(g,title.toUpperCase(),CP+30,y+54,FH(34),K.gold);if(right)tx(g,right,CW-CP-30,y+52,FB(24,600),K.soft,'right')}
// a line made of coloured pieces, shrunk to fit
function segs(g,parts,x,y,size,maxW){let s=size;const meas=()=>parts.reduce((a,p)=>{g.font=FB(s,p.w);return a+g.measureText(p.t).width},0);while(meas()>maxW&&s>16)s--;
 let cx=x;parts.forEach(p=>{g.font=FB(s,p.w);g.fillStyle=p.c;g.textAlign='left';g.fillText(p.t,cx,y);cx+=g.measureText(p.t).width})}
function fitTx(g,s,x,y,size,w,c,a,maxW){let z=size;g.font=FB(z,w);while(g.measureText(s).width>maxW&&z>16){z--;g.font=FB(z,w)}tx(g,s,x,y,FB(z,w),c,a)}
const tcol=n=>teamOf(n)==='BH'?K.bh:teamOf(n)==='RT'?K.rt:K.ink;
let crestImg;
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function ready(){try{if(document.fonts)await Promise.all([FH(40),FB(30,400),FB(30,600),FB(30,700)].map(f=>document.fonts.load(f)))}catch(e){}if(crestImg===undefined)crestImg=await loadImg(CREST)}

function stageInfo(st){if(st==='d1')return{sub:'DAY I · ARRIVAL',line:`${TOUR.location} · ${TOUR.arrive} · ${TOUR.accommodation}`,file:'Day_I'};
 if(st==='final')return{sub:'FINAL RESULTS',line:`${TOUR.place} · ${TOUR.dates}`,file:'Final'};

// going past the last screen starts again with fresh scores
function bsGo(k){BS.t=0;if(k>=BS.slides.length){BS.slides=bsBuild(BS.st);BS.k=0;bsRender();return}BS.k=(k+BS.slides.length)%BS.slides.length;bsMark()}
function bsTick(){if(BS.paused)return;BS.t+=200;$('bsp').style.width=Math.min(100,BS.t/(BSEC*10))+'%';if(BS.t>=BSEC*1000)bsGo(BS.k+1)}
function bsCtl(){$('bsc').classList.remove('off');clearTimeout(BS.hide);BS.hide=setTimeout(()=>$('bsc').classList.add('off'),3500)}
function bsFull(){try{const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)return;const p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function bsOpen(st){BS.st=st;BS.slides=bsBuild(st);if(!BS.slides.length){alert('Nothing to show for this day yet.');return}
 BS.k=0;BS.t=0;BS.paused=false;$('bspause').textContent='Pause';
 $('bs').classList.add('on');$('bsc').style.display='';$('bspw').style.display='';bsFit();bsRender();bsFull();bsCtl();
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>BS.lock=l).catch(()=>{})}catch(e){}   // stop the phone going to sleep
 clearInterval(BS.timer);BS.timer=setInterval(bsTick,200)}
function bsClose(){$('bs').classList.remove('on');$('bsc').style.display='none';$('bspw').style.display='none';clearInterval(BS.timer);$('bss').innerHTML='';
 try{if(BS.lock)BS.lock.release()}catch(e){}BS.lock=null;
 try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}}
const bsOn=()=>$('bs').classList.contains('on');
$('bs').onclick=e=>{const r=$('bss').getBoundingClientRect();bsGo(e.clientX<r.left+r.width/3?BS.k-1:BS.k+1);bsCtl()};
$('bs').onmousemove=bsCtl;
$('bsprev').onclick=()=>{bsGo(BS.k-1);bsCtl()};$('bsnext').onclick=()=>{bsGo(BS.k+1);bsCtl()};
$('bspause').onclick=()=>{BS.paused=!BS.paused;$('bspause').textContent=BS.paused?'Play':'Pause';bsCtl()};
$('bsfs').onclick=()=>{bsFull();bsCtl()};$('bsx').onclick=bsClose;
addEventListener('resize',()=>{if(bsOn())bsFit()});
addEventListener('keydown',e=>{if(!bsOn())return;const k=e.key;
 if(k==='ArrowRight'||k===' '||k==='PageDown'){bsGo(BS.k+1);e.preventDefault()}else if(k==='ArrowLeft'||k==='PageUp'){bsGo(BS.k-1);e.preventDefault()}
 else if(k==='Escape')bsClose();else if(k==='p'||k==='P')$('bspause').click();else if(k==='f'||k==='F')bsFull();bsCtl()});

/* ---------- checks + send ---------- */
function problems(){const p=[];const nh=players().filter(n=>S.hcp[n]==null);if(nh.length)p.push(`No handicap for ${nh.join(', ')}`);['BH','RT'].forEach(t=>{if(!S.cap[t])p.push(`No ${TN[t]} captain chosen`)});
 ['BH','RT'].forEach(t=>{if(!S.shirts[t].colour)p.push(`No ${TN[t]} shirt colour`)});
 S.newPlayers.forEach(x=>{if(x.short&&!x.real)p.push(`First-timer ${x.short} has no full name`)});
 S.rounds.forEach(R=>{if(R.rainedOff)return;const nm='Round '+RN[R.r-1];
  R.matches.forEach((m,i)=>{const need=R.fmt==='Singles'||+m.value===.5?1:2;if(m.bh.slice(0,need).some(x=>!x)||m.rt.slice(0,need).some(x=>!x))p.push(`${nm} match ${i+1}: a player is missing`);if(!m.res)p.push(`${nm} match ${i+1}: no result`);else if(!m.margin)p.push(`${nm} match ${i+1}: no margin`)})});
 COMPS.forEach(([k,lab])=>{const {q,fin}=compState(k);if(q.length===2&&!fin&&!S.rounds[2].rainedOff)p.push(`${lab} play-off: no winner yet`)});
 return p}
function summary(){const [b,r]=pts();const L=[];
 L.push(`BDT ${TOUR.year} results – ${TOUR.place}`);L.push(`Scored by ${S.scorer||'?'} · ${new Date(S.updated||Date.now()).toLocaleString('en-GB')}`);L.push('');
 L.push(`RYDER CUP: Bloodhounds ${fr(b)} – ${fr(r)} Retrievers`);L.push(`Captains: ${S.cap.BH||'?'} (BH) v ${S.cap.RT||'?'} (RT)`);
 L.push(`Bloodhounds: ${squad('BH').join(', ')}`);L.push(`Retrievers: ${squad('RT').join(', ')}`);
 S.newPlayers.filter(x=>x.short).forEach(x=>L.push(`First-timer: ${x.short} = ${x.real}`));
 const hc=players().filter(n=>S.hcp[n]!=null);if(hc.length)L.push('Handicaps: '+hc.map(n=>`${n} ${S.hcp[n]}`).join(', '));
 const po=Object.keys(S.hcp).filter(n=>!S.team[n]&&S.hcp[n]!=null);if(po.length)L.push('Handicaps (pulled out): '+po.map(n=>`${n} ${S.hcp[n]}`).join(', '));
 ['BH','RT'].forEach(t=>{const h=S.shirts[t];if(h.colour)L.push(`${TN[t]} shirt: ${h.colour}${h.logo?' – "'+h.logo+'"':''}`)});
 S.rounds.forEach((R,ri)=>{L.push('');L.push(`ROUND ${RN[R.r-1]} – ${R.course} (${R.fmt})${R.rainedOff?' – RAINED OFF':''}`);
  R.matches.forEach((m,i)=>{const bh=m.bh.filter(Boolean).join(' & '),rt=m.rt.filter(Boolean).join(' & ');const w=m.res==='BH'?'BH':m.res==='RT'?'RT':'Halved';
   L.push(`${i+1}. ${bh} v ${rt}: ${w}${m.res&&m.res!=='H'?' '+m.margin:''}${+m.value===.5?' (½ pt)':''}${m.note?' – '+m.note:''}`)});
  const sc=Object.entries(R.scores).sort((a,b)=>b[1]-a[1]);if(sc.length)L.push('Stableford: '+sc.map(([n,v])=>`${n} ${v}`).join(', '));
  COMPS.forEach(([k])=>{const t=compLine(k,ri);if(t)L.push(t)})});
 const T=ranked().filter(x=>x.tot!=null).sort((a,b)=>(+a.pos||99)-(+b.pos||99)||b.tot-a.tot);
 if(T.length){L.push('');L.push('FINAL POSITIONS');T.forEach(x=>L.push(`${x.pos||'?'}. ${x.n} ${x.tot}`))}
 const tr=S.trophies.filter(t=>t.w.some(Boolean));if(tr.length){L.push('');L.push('TROPHIES');tr.forEach(t=>L.push(`${t.t}: ${t.w.filter(Boolean).join(' & ')}${t.why?' – '+t.why:''}`))}
 const dy=[...STG,'final'].filter(s=>(S.diary[s]||'').trim());if(dy.length){L.push('');L.push('STORIES OF THE DAY');dy.forEach(s=>L.push(`${s==='d1'?'Day I':s==='final'?'Last word':'Round '+RN[+s[1]-1]}: ${S.diary[s].trim()}`))}
 if(S.notes.trim()){L.push('');L.push('NOTES');L.push(S.notes.trim())}
 return L.join('\n')}
const packet=()=>{const final={};const RL=ranked();autoPlacings(RL);RL.forEach(x=>{if(x.pos!=='')final[x.n]=+x.pos});return summary()+'\n\n--- BDT DATA (for Claude, please leave as is) ---\n'+JSON.stringify(Object.assign({},S,{final,tour:{location:TOUR.location,country:TOUR.country||'',start:TOUR.start,end:TOUR.end,accommodation:TOUR.accommodation,days:TOUR.rounds.map(r=>r.day),courses:TOUR.rounds.map(r=>r.full||r.course)}}))+'\n--- END ---'};
function drawSend(){const p=problems();
 $('send').innerHTML=`<h2>Send to Paul</h2>
 ${p.length?`<div class="card"><b class="warn">Still to fill in</b>${p.map(x=>`<div class="warn">• ${esc(x)}</div>`).join('')}<p class="hint">You can still send – Paul will check it.</p></div>`:'<p class="hint" style="color:var(--ok)">Everything looks complete.</p>'}
 <p class="hint">Sends everything entered so far as a message – fine to send after each day as a back-up. Paul checks it, then it goes into the Playbook and onto the website. Nothing is published from this page.</p>
 <div class="row" style="flex-wrap:wrap"><button class="btn" id="share">Share…</button><button class="btn sec" id="copy">Copy</button><button class="btn sec" id="dl">Save as file</button></div>
 <h2>Preview</h2><pre>${esc(summary())}</pre>
 <h2>Hand over to another scorer</h2>
 <p class="hint">Send them the message above; they paste it here to carry on from where you left off.</p>
 <textarea id="imp" placeholder="Paste a BDT results message here"></textarea><button class="btn sec small" id="doimp" style="margin-top:6px">Load it</button>
 <h2>Start again</h2><button class="btn del" id="reset">Clear everything on this phone</button>`;
 $('share').onclick=async()=>{const text=packet();if(navigator.share){try{await navigator.share({title:`BDT ${TOUR.year} results`,text});return}catch(e){if(e.name==='AbortError')return}}copy(text)};
 $('copy').onclick=()=>copy(packet());
 $('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([packet()],{type:'text/plain'}));a.download=`BDT_${TOUR.year}_results.txt`;a.click()};
 $('doimp').onclick=()=>{const t=$('imp').value;const m=t.match(/--- BDT DATA[^\n]*\n([\s\S]*?)\n--- END ---/);try{const d=JSON.parse(m?m[1]:t);if(d.year!==TOUR.year||!d.rounds)throw 0;if(confirm('Replace what is on this phone with the pasted results?')){delete d.final;delete d.tour;S=fix(d);save();draw()}}catch(e){alert("That doesn't look like a BDT results message.")}};
 $('reset').onclick=()=>{if(confirm('Clear all results on this phone? This cannot be undone.')&&confirm('Really clear everything?')){S=blank();save();tab='setup';draw()}};
}
function copy(text,msg){msg=msg||'Copied – paste it into WhatsApp or an email to Paul.';(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>alert(msg)).catch(()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert(msg)})}

function draw(){nav();document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===tab));head();
 if(tab==='setup')drawSetup();else if(tab==='d1')drawDay1();else if(tab[0]==='r')drawRound(+tab[1]-1);else if(tab==='finish')drawFinish();else drawSend()}
draw();
</script>
</body></html>
